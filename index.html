<title>Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060607;--card:#131315;--card2:#1B1B1F;--ink:#F4F2F0;--muted:#9B9BA3;--line:#2A2A30;
  --plate:#E0202B;--plate-ink:#FFFFFF;--pr:#FF5A62;--ok:#2FBF8A;--okbg:#0E3A2C;--okline:#1F7A58;
  --navy:#0C2347;--navy2:#1B4A94;--blue:#7DAEFF;--green:#0F3D2E;
  --fd:"Barlow Condensed","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --fb:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.4}
body{min-height:100%;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 190px}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 0 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.hdr .grow{flex:1;min-width:0}
h1{font-family:var(--fd);font-weight:700;font-size:38px;line-height:1;margin:0;letter-spacing:.2px}
h2{font-family:var(--fd);font-weight:600;font-size:24px;margin:26px 0 10px}
.sub{margin:6px 0 0;color:var(--muted);font-size:15px}
.hint{color:var(--muted);margin:18px 0}
.title-in{font-family:var(--fd);font-weight:700;font-size:34px;line-height:1.05;width:100%;background:none;border:0;border-bottom:2px solid var(--line);padding:0 0 2px;border-radius:0}
.title-in:focus{outline:none;border-bottom-color:var(--plate)}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--muted);flex:none}
.icon:active{background:var(--line)}
.icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;font-size:16px;background:var(--card);border:1.5px solid var(--line)}
.btn.primary{background:var(--plate);border-color:var(--plate);color:var(--plate-ink)}
.btn.ghost{border-style:dashed;background:none;color:var(--plate);border-color:var(--plate)}
.btn.danger{background:var(--pr);border-color:var(--pr);color:#fff}
.btn.danger-ghost{background:none;color:var(--pr);border-color:transparent}
.btn.small{min-height:38px;padding:0 14px;font-size:15px}
.btn.big{width:100%;min-height:54px;font-size:18px;margin:6px 0}
.btn:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.tpl{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tpl .acts{display:flex;align-items:center;gap:4px;flex:none}
.tpl b{display:block;font-size:17px}
.meta{display:block;color:var(--muted);font-size:14px}
.exhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.exname{font-family:var(--fd);font-weight:700;font-size:24px;line-height:1.1;text-align:left}
.last{color:var(--muted);font-size:14px;margin:2px 0 0}
.setrow,.sethead{display:grid;grid-template-columns:30px 1fr 74px 66px 46px;gap:8px;align-items:center;padding:4px 6px;border-radius:12px}
.sethead{color:var(--muted);font-size:13px;padding-bottom:0}
.sethead span{text-align:center}
.setrow.done{background:var(--okbg);box-shadow:inset 0 0 0 1px var(--okline)}
.sn{font-family:var(--fd);font-weight:700;font-size:20px;text-align:center;color:var(--muted)}
.prev{font-size:14px;color:var(--muted);text-align:center;min-height:40px;border-radius:8px}
.num{width:100%;height:42px;text-align:center;font-family:var(--fd);font-weight:600;font-size:22px;background:var(--bg);border:1.5px solid transparent;border-radius:10px}
.num:focus{outline:none;border-color:var(--plate)}
.num::placeholder{color:var(--muted);opacity:.6}

function eqOf(c){
  if(!c)return null;
  var k=c.charAt(0),r=+c.slice(1);
  if(c==='d')return {k:'db'};
  if(c==='dv')return {k:'dbv'};
  return {k:{b:'bar',n:'neck',f:'front',h:'hip'}[k],r:r};
}
function X(id,name,group,muscles,tpl,eq,steps,tips,labels){
  var o={id:id,name:name,group:group,muscles:muscles,scene:null,eq:eqOf(eq),steps:steps.split('|'),tips:tips.split('|')};
  if(tpl&&TP[tpl]){o.scene=TP[tpl].scene;o.frames=TP[tpl].frames;o.labels=labels||TP[tpl].labels}
  return o;
}

var KEY='gymlog.v1';
var S={workouts:[],templates:[],custom:[],settings:{rest:90},active:null};
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);S.workouts=o.workouts||[];S.templates=o.templates||[];S.custom=o.custom||[];S.active=o.active||null;S.settings=Object.assign({rest:90},o.settings||{})}}catch(e){}
  sortW();
}
var saveTimer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Não foi possível guardar neste browser.')}}
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(save,350)}
function sortW(){S.workouts.sort(function(a,b){return new Date(a.date)-new Date(b.date)})}
function allEx(){return EXS.concat(S.custom.map(function(c){return {id:c.id,name:c.name,group:c.group,muscles:c.group,custom:true}}))}
function exById(id){var a=allEx();for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
function exName(id,fallback){var x=exById(id);return x?x.name:(fallback||'Exercício')}
function lastSets(exId){
  for(var i=S.workouts.length-1;i>=0;i--){var e=S.workouts[i].exs.filter(function(x){return x.exId===exId})[0];if(e&&e.sets.length)return e.sets}
  return null;
}
function fmtSet(s){return s.kg>0?fmtKg(s.kg)+'×'+s.reps:s.reps+' reps'}
function fmtDur(ms){var t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')}
function fmtDate(iso){return new Date(iso).toLocaleDateString('pt-PT',{weekday:'short',day:'numeric',month:'short'})}
function ago(iso){var d=Math.round((Date.now()-new Date(iso))/864e5);return d<=0?'hoje':d===1?'ontem':'há '+d+' dias'}
function prevFor(ei,si){
  var ex=S.active.exs[ei],last=lastSets(ex.exId);
  if(last&&last.length)return last[Math.min(si,last.length-1)];
  for(var k=si-1;k>=0;k--){var p=ex.sets[k];if(p&&num(p.reps)>0)return {kg:num(p.kg),reps:num(p.reps)}}
  return null;
}
function newSets(n){var a=[];for(var i=0;i<n;i++)a.push({kg:'',reps:'',done:false});return a}
function startWorkout(exIds){
  var d=new Date();
  S.active={id:uid(),start:d.toISOString(),name:'Treino de '+d.toLocaleDateString('pt-PT',{weekday:'long'}),exs:(exIds||[]).map(function(id){return {exId:id,name:exName(id),sets:newSets(3)}})};
  save();tab='treino';renderApp();window.scrollTo(0,0);
}

/* ---------- render: separador Treino ---------- */
function hdr(title,sub){return '<header class="hdr"><div class="grow"><h1>'+title+'</h1>'+(sub?'<p class="sub">'+sub+'</p>':'')+'</div><button class="icon" data-act="settings" aria-label="Ajustes">'+ICON.gear+'</button></header>'}
function treinoHTML(){
  if(S.active)return activeHTML();
  var last=S.workouts[S.workouts.length-1];
  var h=hdr('Olá, '+esc(A&&A.name?A.name:'atleta'),last?'Último treino: '+esc(last.name)+', '+ago(last.date):'Regista exercícios, cargas e repetições.');
  h+=weekHTML();
  h+='<button class="btn hero" style="width:100%" data-act="start-empty">Começar treino</button>';
  if(S.templates.length){
    h+='<h2>Modelos</h2>';
    S.templates.forEach(function(t){
      h+='<div class="card tpl"><div><b>'+esc(t.name)+'</b><span class="meta">'+t.exIds.map(function(id){return esc(exName(id,'?'))}).join(', ')+'</span></div><div class="acts"><button class="btn small primary" data-act="start-tpl" data-id="'+esc(t.id)+'">Começar</button><button class="icon" data-act="del-tpl" data-id="'+esc(t.id)+'" aria-label="Apagar modelo">'+ICON.trash+'</button></div></div>';
    });
  }else h+='<p class="hint">Ao terminares um treino, podes guardá-lo como modelo para o repetires.</p>';
  return h;
}
function dayKey(d){return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}
function weekHTML(){
  var now=new Date(),dow=(now.getDay()+6)%7,mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow);
  var done={};S.workouts.forEach(function(w){done[dayKey(new Date(w.date))]=1});
  var L7=['S','T','Q','Q','S','S','D'],n=0,cells='';
  for(var i=0;i<7;i++){
    var d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i),on=!!done[dayKey(d)],td=i===dow;
    if(on)n++;
    cells+='<div class="wk-d'+(on?' on':'')+(td?' today':'')+'"><i>'+d.getDate()+'</i><span>'+L7[i]+'</span></div>';
  }
  return '<section class="week" aria-label="Esta semana"><div class="wk-top"><b>Esta semana</b><span>'+n+(n===1?' treino':' treinos')+'</span></div><div class="wk-days">'+cells+'</div></section>';
}
function activeHTML(){
  var a=S.active;
  var h='<header class="hdr"><div class="grow"><input class="title-in" data-f="aname" value="'+esc(a.name)+'" aria-label="Nome do treino"><p class="sub">Duração <b id="elapsed">'+fmtDur(Date.now()-new Date(a.start))+'</b></p></div><button class="icon" data-act="settings" aria-label="Ajustes">'+ICON.gear+'</button></header>';
  if(!a.exs.length)h+='<p class="hint">Adiciona o primeiro exercício para começares.</p>';
  a.exs.forEach(function(e,i){h+=exCardHTML(e,i)});
  h+='<button class="btn ghost big" data-act="add-ex">+ Adicionar exercício</button>';
  h+='<div class="endrow"><button class="btn primary" data-act="finish">Terminar treino</button><button class="btn danger-ghost" data-act="cancel-active">Descartar</button></div>';
  return h;
}
function exCardHTML(e,ei){
  var last=lastSets(e.exId);
  var h='<section class="card"><div class="exhead"><div><button class="exname" data-act="ex-detail" data-id="'+esc(e.exId)+'">'+esc(exName(e.exId,e.name))+'</button><p class="last">'+(last?'Última vez: '+last.map(fmtSet).join(' · '):'Primeira vez')+'</p></div><button class="icon" data-act="rm-ex" data-ei="'+ei+'" aria-label="Remover exercício">'+ICON.trash+'</button></div>';
  h+='<div class="sethead"><span>Série</span><span>Anterior</span><span>kg</span><span>Reps</span><span></span></div>';
  e.sets.forEach(function(s,si){
    var pv=prevFor(ei,si);
    h+='<div class="setrow'+(s.done?' done':'')+'"><span class="sn">'+(si+1)+'</span>'+
      '<button class="prev" data-act="fillprev" data-ei="'+ei+'" data-si="'+si+'" aria-label="Usar valores anteriores">'+(pv?fmtSet(pv):'–')+'</button>'+
      '<input class="num" inputmode="decimal" data-f="kg" data-ei="'+ei+'" data-si="'+si+'" value="'+esc(s.kg)+'" placeholder="'+(pv&&pv.kg>0?fmtKg(pv.kg):'kg')+'" aria-label="Peso em kg, série '+(si+1)+'">'+
      '<input class="num" inputmode="numeric" data-f="reps" data-ei="'+ei+'" data-si="'+si+'" value="'+esc(s.reps)+'" placeholder="'+(pv?pv.reps:'reps')+'" aria-label="Repetições, série '+(si+1)+'">'+
      '<button class="chk" data-act="toggle" data-ei="'+ei+'" data-si="'+si+'" aria-pressed="'+(s.done?'true':'false')+'" aria-label="Série feita">'+ICON.check+'</button></div>';
  });
  h+='<div class="exacts"><button class="btn small" data-act="add-set" data-ei="'+ei+'">+ Série</button>'+(e.sets.length>1?'<button class="btn small danger-ghost" data-act="rm-set" data-ei="'+ei+'">Remover última</button>':'')+'</div></section>';
  return h;
}

function filtered(q,g){
  q=norm(q);
  return allEx().filter(function(x){
    var gok=g==='all'||(g==='custom'?x.custom:x.group===g);
    return gok&&(!q||norm(x.name+' '+(x.muscles||'')+' '+x.group).indexOf(q)>-1);
  });
}

function itemHTML(x,mode){
  var gc=' style="border-left-color:'+gcol(x.group)+'"';

function listHTML(q,g,mode){

function historicoHTML(){

      if(w.prs&&w.prs.length){h+='<ul class="prl">'+w.prs.map(function(p){return '<li><b>'+esc(p.name)+'</b>: '+esc(p.text)+'</li>'}).join('')+'</ul>'}

    }

/* ---------- render: Progresso ---------- */
function metricVal(e,m){
  var sets=e.sets,v=0;
  if(m==='peso')sets.forEach(function(s){if(s.kg>v)v=s.kg});
  else if(m==='rm')sets.forEach(function(s){if(s.kg>0){var r=est1rm(s.kg,s.reps);if(r>v)v=r}});
  else if(m==='vol')sets.forEach(function(s){v+=s.kg*s.reps});
  else sets.forEach(function(s){if(s.reps>v)v=s.reps});
  return v;
}
function series(exId,m){
  var pts=[];
  S.workouts.forEach(function(w){
    var e=w.exs.filter(function(x){return x.exId===exId})[0];
    if(!e)return;
    var v=metricVal(e,m);
    if(v>0)pts.push({t:new Date(w.date).getTime(),v:v});
  });
  var mx=0;pts.forEach(function(p,i){p.pr=i>0&&p.v>mx;if(p.v>mx)mx=p.v});
  return pts;
}
function chartSVG(pts,unit){
  var W=340,H=170,Lm=40,R=12,T=12,B=26;
  var xs=pts.map(function(p){return p.t}),ys=pts.map(function(p){return p.v});
  var x0=Math.min.apply(0,xs),x1=Math.max.apply(0,xs);if(x0===x1){x0-=864e5*3;x1+=864e5*3}
  var y0=Math.min.apply(0,ys),y1=Math.max.apply(0,ys),pad=(y1-y0)*.25||Math.max(1,y1*.15);
  y0=Math.max(0,Math.floor(y0-pad));y1=Math.ceil(y1+pad);if(y1===y0)y1=y0+1;
  var X=function(t){return Lm+(t-x0)/(x1-x0)*(W-Lm-R)},Y=function(v){return T+(1-(v-y0)/(y1-y0))*(H-T-B)};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de progressão">';
  for(var i=0;i<3;i++){var v=y0+(y1-y0)*i/2,y=Y(v);s+='<line class="gl" x1="'+Lm+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text class="tx2" x="'+(Lm-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+fmtKg(v)+'</text>'}
  var d=pts.map(function(p,i){return (i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.v).toFixed(1)}).join(' ');
  if(pts.length>1)s+='<path class="ln" d="'+d+'"/>';
  pts.forEach(function(p){s+='<circle class="'+(p.pr?'ptpr':'pt')+'" cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="4.5"/>'});
  var dl=function(t){return new Date(t).toLocaleDateString('pt-PT',{day:'numeric',month:'short'})};
  s+='<text class="tx2" x="'+Lm+'" y="'+(H-8)+'">'+dl(Math.min.apply(0,xs))+'</text><text class="tx2" x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+dl(Math.max.apply(0,xs))+'</text></svg>';
  return s;
}
function usedExIds(){
  var seen={},out=[];
  S.workouts.forEach(function(w){w.exs.forEach(function(e){if(!seen[e.exId]){seen[e.exId]=1;out.push({id:e.exId,name:exName(e.exId,e.name)})}})});
  return out.sort(function(a,b){return a.name.localeCompare(b.name,'pt')});
}
function progressoHTML(){
  var h=hdr('Progresso');
  var used=usedExIds();
  if(!used.length)return h+'<p class="empty">O gráfico e os recordes aparecem depois do teu primeiro treino guardado.</p>';
  if(!progEx||!used.some(function(u){return u.id===progEx}))progEx=used[0].id;
  var units={peso:'kg',rm:'kg',vol:'kg',reps:'reps'},labels={peso:'Peso máximo',rm:'1RM estimado',vol:'Volume total',reps:'Repetições (melhor série)'};
  h+='<label class="field"><span>Exercício</span><select data-f="progex">'+used.map(function(u){return '<option value="'+esc(u.id)+'"'+(u.id===progEx?' selected':'')+'>'+esc(u.name)+'</option>'}).join('')+'</select></label>';
  h+='<label class="field"><span>Medida</span><select data-f="progmetric">'+Object.keys(labels).map(function(k){return '<option value="'+k+'"'+(k===progMetric?' selected':'')+'>'+labels[k]+'</option>'}).join('')+'</select></label>';
  var pts=series(progEx,progMetric);
  if(pts.length)h+='<div class="chartbox">'+chartSVG(pts,units[progMetric])+'<p class="note" style="margin:6px 4px 0">Pontos verdes: novo máximo ('+units[progMetric]+').</p></div>';
  else h+='<p class="hint">Sem dados para esta medida neste exercício.</p>';
  h+='<h2>Recordes</h2><div class="card">';
  var any=false;
  used.forEach(function(u){
    var bestKg=0,bestRepsAt=0,bestDate='',bestRm=0,bestReps=0;
    S.workouts.forEach(function(w){w.exs.forEach(function(e){if(e.exId!==u.id)return;e.sets.forEach(function(s){
      if(s.kg>bestKg||(s.kg===bestKg&&s.kg>0&&s.reps>bestRepsAt)){if(s.kg>0){bestKg=s.kg;bestRepsAt=s.reps;bestDate=w.date}}
      if(s.kg>0){var r=est1rm(s.kg,s.reps);if(r>bestRm)bestRm=r}
      if(s.kg===0&&s.reps>bestReps)bestReps=s.reps;
    })})});
    var v='',sm='';
    if(bestKg>0){v=fmtKg(bestKg)+' kg × '+bestRepsAt;sm='1RM est. '+fmtKg(round1(bestRm))+' kg · '+fmtDate(bestDate)}
    else if(bestReps>0){v=bestReps+' reps';sm='Peso corporal'}
    else return;
    any=true;
    h+='<div class="rec"><b>'+esc(u.name)+'</b><span class="v">'+v+'<small>'+sm+'</small></span></div>';
  });
  if(!any)h+='<p class="hint" style="margin:0">Sem recordes ainda.</p>';
  return h+'</div>';
}

/* ---------- descanso ---------- */
var ac=null;
function beep(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.3)}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
}
function startRest(){var ms=S.settings.rest*1000;rest={endAt:Date.now()+ms,total:ms,done:false};renderRest()}
var RC=138.23;
function renderRest(){
  var el=$('#restbar');
  if(!rest){el.innerHTML='';return}
  var frac=rest.done?1:Math.max(0,Math.min(1,(rest.endAt-Date.now())/rest.total));
  el.innerHTML='<div class="rest'+(rest.done?' over':'')+'" role="timer"><div class="rowr"><svg class="ring" viewBox="0 0 54 54" aria-hidden="true"><circle class="trk" cx="27" cy="27" r="22"/><circle class="prg" id="rprg" cx="27" cy="27" r="22" stroke-dasharray="'+RC+'" stroke-dashoffset="'+(RC*(1-frac)).toFixed(1)+'"/></svg><div class="t"><span class="lbl">'+(rest.done?'Descanso terminado':'Descanso')+'</span><span id="rt">'+(rest.done?'Próxima série':fmtDur(rest.endAt-Date.now()+500))+'</span></div>'+(rest.done?'':'<button data-act="rest-add" data-s="-15" aria-label="Menos 15 segundos">−15</button><button data-act="rest-add" data-s="15" aria-label="Mais 15 segundos">+15</button>')+'<button data-act="rest-skip">'+(rest.done?'Fechar':'Saltar')+'</button></div></div>';
}
function tick(){
  if(rest){
    var ms=rest.endAt-Date.now();
    if(!rest.done&&ms<=0){rest.done=true;rest.doneAt=Date.now();beep();renderRest()}
    else if(rest.done&&Date.now()-rest.doneAt>6000){rest=null;renderRest()}
    else if(!rest.done){var rt=$('#rt'),rp=$('#rprg');if(rt)rt.textContent=fmtDur(ms+500);if(rp)rp.setAttribute('stroke-dashoffset',(RC*(1-Math.max(0,Math.min(1,ms/rest.total)))).toFixed(1))}
  }
  var el=$('#elapsed');if(el&&S.active)el.textContent=fmtDur(Date.now()-new Date(S.active.start));
}

/* ---------- acabar treino ---------- */
function bestsBefore(){
  var b={};
  S.workouts.forEach(function(w){w.exs.forEach(function(e){
    var o=b[e.exId]||(b[e.exId]={kg:0,rm:0,reps:0});
    e.sets.forEach(function(s){
      if(s.kg>o.kg)o.kg=s.kg;
      if(s.kg>0){var r=est1rm(s.kg,s.reps);if(r>o.rm)o.rm=r}
      if(s.kg===0&&s.reps>o.reps)o.reps=s.reps;
    });
  })});
  return b;
}
function finish(){
  var a=S.active;
  var exs=a.exs.map(function(e){return {exId:e.exId,name:exName(e.exId,e.name),sets:e.sets.filter(function(s){return s.done&&num(s.reps)>0}).map(function(s){return {kg:num(s.kg),reps:num(s.reps)}})}}).filter(function(e){return e.sets.length});
  if(!exs.length){toast('Marca pelo menos uma série como feita.');return}
  var best=bestsBefore(),prs=[];
  exs.forEach(function(e){
    var b=best[e.exId];if(!b)return;
    var mk=0,mr=0,mreps=0;
    e.sets.forEach(function(s){if(s.kg>mk)mk=s.kg;if(s.kg>0){var r=est1rm(s.kg,s.reps);if(r>mr)mr=r}if(s.kg===0&&s.reps>mreps)mreps=s.reps});
    if(mk>0){
      if(b.kg>0&&mk>b.kg)prs.push({name:e.name,text:'peso máximo de '+fmtKg(mk)+' kg'});
      else if(b.rm>0&&mr>b.rm+.001)prs.push({name:e.name,text:'1RM estimado de '+fmtKg(round1(mr))+' kg'});
    }else if(b.reps>0&&mreps>b.reps)prs.push({name:e.name,text:mreps+' repetições (antes: '+b.reps+')'});
  });
  var w={id:a.id,date:a.start,name:a.name||'Treino',dur:Math.max(1,Math.round((Date.now()-new Date(a.start))/60000)),exs:exs,prs:prs};
  S.workouts.push(w);sortW();S.active=null;rest=null;renderRest();save();
  tab='treino';renderApp();
  modal={type:'summary',w:w};renderModal();
}

function payload(){return JSON.stringify({app:'gymlog',version:1,exportedAt:new Date().toISOString(),workouts:S.workouts,templates:S.templates,custom:S.custom,settings:S.settings},null,1)}
function csvData(){
  var rows=[['data','treino','exercicio','serie','kg','reps']];
  S.workouts.forEach(function(w){w.exs.forEach(function(e){e.sets.forEach(function(s,i){rows.push([w.date.slice(0,10),w.name,exName(e.exId,e.name),i+1,String(s.kg).replace('.',','),s.reps])})})});
  return '\ufeff'+rows.map(function(r){return r.map(function(c){c=String(c);return /[";\n,]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')}).join('\n');
}
function exportFile(name,data){
  var p;
  try{p=window.claude&&window.claude.use?window.claude.use('downloads'):null}catch(e){p=null}
  Promise.resolve(p).then(function(dl){
    if(!dl){fallbackText(name,data);return}
    return dl.save({filename:name,data:data}).then(function(){toast('Ficheiro guardado.')},function(e){if(e&&e.code==='declined')return;fallbackText(name,data)});
  },function(){fallbackText(name,data)});
}
function fallbackText(name,data){modal={type:'text',title:name,text:data,note:'Não foi possível guardar o ficheiro daqui. Copia o texto e guarda-o num ficheiro ou numa nota tua.'};renderModal()}
function mergeData(o){
  if(!o||!Array.isArray(o.workouts))throw new Error('formato');
  var n=0,ids={};S.workouts.forEach(function(w){ids[w.id]=1});
  o.workouts.forEach(function(w){if(w&&w.id&&w.date&&Array.isArray(w.exs)&&!ids[w.id]){S.workouts.push(w);ids[w.id]=1;n++}});
  var t={};S.templates.forEach(function(x){t[x.id]=1});(o.templates||[]).forEach(function(x){if(x&&x.id&&Array.isArray(x.exIds)&&!t[x.id]){S.templates.push(x);t[x.id]=1}});
  var c={};S.custom.forEach(function(x){c[x.id]=1});(o.custom||[]).forEach(function(x){if(x&&x.id&&x.name&&!c[x.id]){S.custom.push(x);c[x.id]=1}});
  sortW();save();return n;
}
function doImport(text){
  try{var n=mergeData(JSON.parse(text));toast(n+(n===1?' treino importado.':' treinos importados.'));modal=null;renderModal();renderApp()}
  catch(e){toast('Ficheiro inválido: usa um JSON exportado por esta app.')}
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var tb=e.target.closest('[data-tab]');
  if(tb){tab=tb.dataset.tab;renderApp();window.scrollTo(0,0);return}
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var act=el.dataset.act,d=el.dataset;
  if(act==='overlay'){if(e.target===el)closeModal();return}
  switch(act){
    case 'k':pressDigit(d.d);break;
    case 'kdel':delDigit();break;
    case 'lk-name-go':nameGo();break;
    case 'lock-now':modal=null;renderModal();lockNow();break;
    case 'forgot':LK.mode='forgot';renderLock();break;
    case 'forgot-back':LK.mode='login';LK.pin='';renderLock();break;
    case 'forgot-do':resetAll();break;
    case 'noop':break;
    case 'start-empty':startWorkout([]);break;
    case 'start-tpl':var t=S.templates.filter(function(x){return x.id===d.id})[0];if(t)startWorkout(t.exIds);break;
    case 'del-tpl':ask('Apagar este modelo?','Apagar').then(function(ok){if(ok){S.templates=S.templates.filter(function(x){return x.id!==d.id});save();renderApp()}});break;
    case 'add-ex':pickQ='';pickGroup='all';modal={type:'picker'};renderModal();break;
    case 'pick-ex':if(S.active&&!S.active.exs.some(function(x){return x.exId===d.id})){S.active.exs.push({exId:d.id,name:exName(d.id),sets:newSets(3)});save();renderApp();renderModal()}break;
    case 'ex-detail':modal={type:'detail',id:d.id};renderModal();break;
    case 'rm-ex':ask('Remover este exercício do treino?','Remover').then(function(ok){if(ok){S.active.exs.splice(+d.ei,1);save();renderApp()}});break;
    case 'add-set':var ex=S.active.exs[+d.ei];ex.sets.push({kg:'',reps:'',done:false});save();renderApp();break;
    case 'rm-set':S.active.exs[+d.ei].sets.pop();save();renderApp();break;
    case 'fillprev':var ei=+d.ei,si=+d.si,pv=prevFor(ei,si);if(pv){var s=S.active.exs[ei].sets[si];s.kg=pv.kg>0?String(pv.kg):'';s.reps=String(pv.reps);save();renderApp()}break;
    case 'toggle':toggleSet(+d.ei,+d.si);break;
    case 'finish':finish();break;
    case 'cancel-active':ask('Descartar este treino? Os dados que registaste agora perdem-se.','Descartar').then(function(ok){if(ok){S.active=null;rest=null;renderRest();save();renderApp()}});break;
    case 'ex-group':exGroup=d.g;renderApp();break;
    case 'pick-group':pickGroup=d.g;renderModal();break;
    case 'new-ex':modal={type:'newex'};renderModal();break;
    case 'save-newex':var nm=($('#nx-name').value||'').trim();if(!nm){toast('Escreve o nome do exercício.');break}S.custom.push({id:'c-'+uid(),name:nm,group:$('#nx-group').value});save();modal=null;renderModal();renderApp();toast('Exercício criado.');break;
    case 'del-custom':ask('Apagar este exercício? O histórico mantém o nome.','Apagar').then(function(ok){if(ok){S.custom=S.custom.filter(function(x){return x.id!==d.id});save();modal=null;renderModal();renderApp()}});break;
    case 'hist-toggle':openHist[d.id]=!openHist[d.id];renderApp();break;
    case 'hist-del':ask('Apagar este treino do histórico?','Apagar').then(function(ok){if(ok){S.workouts=S.workouts.filter(function(x){return x.id!==d.id});save();renderApp()}});break;
    case 'hist-repeat':var w=S.workouts.filter(function(x){return x.id===d.id})[0];if(w){if(S.active){toast('Termina ou descarta o treino atual primeiro.')}else startWorkout(w.exs.map(function(x){return x.exId}))}break;
    case 'settings':modal={type:'settings'};renderModal();break;
    case 'export-json':exportFile('treinos-'+new Date().toISOString().slice(0,10)+'.json',payload());break;
    case 'export-csv':exportFile('treinos-'+new Date().toISOString().slice(0,10)+'.csv',csvData());break;
    case 'import-text':doImport(($('#imp-text').value||'').trim());break;
    case 'wipe':ask('Apagar todos os treinos, modelos e exercícios criados? Não dá para desfazer.','Apagar tudo').then(function(ok){if(ok){S={workouts:[],templates:[],custom:[],settings:S.settings,active:null};rest=null;renderRest();save();modal=null;renderModal();renderApp();toast('Dados apagados.')}});break;
    case 'save-tpl':var tn=($('#tpl-name').value||'').trim()||'Modelo';var sw=modal.w;S.templates.push({id:uid(),name:tn,exIds:sw.exs.map(function(x){return x.exId})});save();modal=null;renderModal();renderApp();toast('Modelo guardado.');break;
    case 'rest-add':if(rest&&!rest.done){rest.endAt+=(+d.s)*1000;rest.total=Math.max(rest.total,rest.endAt-Date.now());renderRest()}break;
    case 'rest-skip':rest=null;renderRest();break;
    case 'modal-close':closeModal();break;
    case 'confirm-ok':if(modal&&modal.res){var r=modal.res;modal=null;renderModal();r(true)}break;
    case 'copy-text':var ta=$('#txt-out');ta.select();var done=false;try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(function(){toast('Copiado.')},function(){document.execCommand('copy');toast('Copiado.')});done=true}}catch(x){}if(!done){try{document.execCommand('copy');toast('Copiado.')}catch(x2){toast('Seleciona o texto e copia manualmente.')}}break;
  }
});
function toggleSet(ei,si){
  var ex=S.active.exs[ei],s=ex.sets[si];
  if(!s.done){
    var pv=prevFor(ei,si);
    if(!(num(s.reps)>0)){if(pv&&pv.reps>0){s.reps=String(pv.reps)}else{toast('Indica as repetições.');return}}
    if(s.kg===''&&pv&&pv.kg>0)s.kg=String(pv.kg);
    s.done=true;startRest();
  }else s.done=false;
  save();renderApp();
}
document.addEventListener('input',function(e){
  var t=e.target,f=t.dataset&&t.dataset.f;if(!f)return;
  if((f==='kg'||f==='reps')&&S.active){S.active.exs[+t.dataset.ei].sets[+t.dataset.si][f]=t.value;saveSoon()}
  else if(f==='aname'&&S.active){S.active.name=t.value;saveSoon()}
  else if(f==='q'){exQ=t.value;renderExList()}
  else if(f==='pq'){pickQ=t.value;renderPickList()}
});
document.addEventListener('change',function(e){
  var t=e.target,f=t.dataset&&t.dataset.f;
  if(f==='progex'){progEx=t.value;renderApp()}
  else if(f==='progmetric'){progMetric=t.value;renderApp()}
  else if(f==='restsec'){S.settings.rest=+t.value;save()}
  else if(t.id==='imp-file'&&t.files&&t.files[0]){var r=new FileReader();r.onload=function(){doImport(String(r.result))};r.onerror=function(){toast('Não foi possível ler o ficheiro.')};r.readAsText(t.files[0])}
});
document.addEventListener('keydown',function(e){
  if(LK.show){
    if(LK.mode==='name'){if(e.key==='Enter')nameGo();return}
    if(/^[0-9]$/.test(e.key))pressDigit(e.key);else if(e.key==='Backspace')delDigit();
    return;
  }
  if(e.key==='Escape'&&modal)closeModal();
});
document.addEventListener('click',function(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)()}if(ac&&ac.resume)ac.resume()}catch(e){}},{once:true});
var hiddenAt=0;
document.addEventListener('visibilitychange',function(){
  if(document.hidden){hiddenAt=Date.now();return}
  if(A&&!LK.show&&hiddenAt&&Date.now()-hiddenAt>300000)lockNow();
  tick();
});

/* ---------- login / bloqueio ---------- */
var AKEY='gymlog.auth',A=null;
var LK={show:true,mode:'login',pin:'',first:'',fails:0,until:0,busy:false,lift:false};
function loadAuth(){try{var r=localStorage.getItem(AKEY);A=r?JSON.parse(r):null}catch(e){A=null}if(A&&!(A.hash&&A.salt))A=null}
function saveAuth(){try{localStorage.setItem(AKEY,JSON.stringify(A))}catch(e){}}
function hashPin(pin,salt){
  var str=salt+':'+pin;
  try{
    if(window.crypto&&crypto.subtle&&window.TextEncoder){
      return crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0')}).join('')});
    }
  }catch(e){}
  var h=2166136261;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),16777619)>>>0}
  return Promise.resolve('f'+h.toString(16));
}
function setInert(v){
  ['#app','#restbar','.tabbar','#modal'].forEach(function(q){var e=document.querySelector(q);if(e){if(v)e.setAttribute('inert','');else e.removeAttribute('inert')}});
}
function bellSVG(){
  var cols=['#E0202B','#2F6FD6','#1F9A6B','#E9E6E2'],hs=[112,94,78,62];
  var s='<svg class="bell" id="bell" viewBox="0 0 360 150" aria-hidden="true"><g class="bar-g"><rect x="8" y="71" width="344" height="8" rx="4" fill="#7E7E87"/><rect x="150" y="68" width="60" height="14" rx="2" fill="#4A4A52"/>';
  for(var i=0;i<4;i++){
    var h=hs[i],y=75-h/2,xr=256+i*20,xl=88-i*20;
    s+='<g class="pl" data-i="'+i+'" style="--c:'+cols[i]+'"><rect x="'+xl+'" y="'+y+'" width="16" height="'+h+'" rx="4"/><rect x="'+xr+'" y="'+y+'" width="16" height="'+h+'" rx="4"/></g>';
  }
  return s+'</g></svg>';
}
function padHTML(){
  var h='<div class="pad">';
  for(var i=1;i<=9;i++)h+='<button class="key" data-act="k" data-d="'+i+'" aria-label="'+i+'">'+i+'</button>';
  return h+'<button class="key blank" tabindex="-1" aria-hidden="true"></button><button class="key" data-act="k" data-d="0" aria-label="0">0</button><button class="key sm" data-act="kdel" aria-label="Apagar último dígito">⌫</button></div>';
}
function renderLock(msg,isErr){
  var el=$('#lock');
  if(!LK.show){el.style.display='none';el.innerHTML='';el.classList.remove('lift');setInert(false);return}
  setInert(true);
  el.style.display='flex';el.classList.toggle('lift',!!LK.lift);
  var brand='<div class="lk-top"><div class="lk-brand"><i></i>TREINO</div></div>',h='';
  if(LK.mode==='name'){
    h=brand+'<div class="lk-mid"><h1 class="lk-t">Bem-vindo</h1><p class="lk-s">Vamos criar o teu acesso. Como te devo chamar?</p><input id="lk-name" class="lk-in" maxlength="24" autocomplete="off" autocapitalize="words" placeholder="O teu nome" aria-label="O teu nome"><button class="btn primary lk-btn" data-act="lk-name-go">Continuar</button></div><div class="lk-bot"></div>';
  }else if(LK.mode==='forgot'){
    h=brand+'<div class="lk-mid"><h1 class="lk-t">Repor acesso</h1><p class="lk-warn">O PIN só existe neste dispositivo e não dá para o recuperar. Para criares um novo, é preciso apagar todos os treinos guardados na app.</p><button class="btn danger lk-btn" data-act="forgot-do">Apagar tudo e repor</button><button class="btn lk-btn" style="margin-top:10px" data-act="forgot-back">Voltar</button></div><div class="lk-bot"></div>';
  }else{
    var title=LK.mode==='login'?'Olá, '+esc(A&&A.name?A.name:''):LK.mode==='setup'?'Cria o teu PIN':'Repete o PIN';
    var sub=LK.mode==='login'?'Carrega a barra com o teu PIN.':LK.mode==='setup'?'4 dígitos para entrares na app.':'Escreve o mesmo PIN outra vez.';
    h=brand+'<div class="lk-mid"><h1 class="lk-t">'+title+'</h1><p class="lk-s">'+sub+'</p>'+bellSVG()+'<p class="lk-m'+(isErr?' err':'')+'" id="lk-msg" role="status">'+esc(msg||'')+'</p></div><div class="lk-bot">'+padHTML()+(LK.mode==='login'?'<button class="lk-link" data-act="forgot">Esqueci o PIN</button>':'')+'</div>';
  }
  el.innerHTML='<span class="lk-ref-v" aria-hidden="true">範馬刃牙・拳願阿修羅</span><span class="lk-ref-b" aria-hidden="true">Baki Hanma · Kengan Ashura</span>'+h;
  if(LK.mode==='name'){var ni=$('#lk-name');if(ni)setTimeout(function(){try{ni.focus()}catch(e){}},50)}
  else if(LK.mode!=='forgot')updatePlates();
}
function updatePlates(){
  var n=LK.pin.length;
  Array.prototype.forEach.call(document.querySelectorAll('#bell .pl'),function(g){
    var on=+g.getAttribute('data-i')<n,has=g.classList.contains('on');
    if(on&&!has)g.classList.add('on');
    else if(!on&&has)g.classList.remove('on');
  });
}
function setMsg(t,err){var m=$('#lk-msg');if(m){m.textContent=t||'';m.classList.toggle('err',!!err)}}
function shakeBell(){
  var b=$('#bell');if(!b)return;
  b.classList.remove('shake');void b.getBoundingClientRect();b.classList.add('shake');
  setTimeout(function(){var x=$('#bell');if(x)x.classList.remove('shake')},450);
}
function pressDigit(d){
  if(!LK.show||LK.busy||Date.now()<LK.until||LK.mode==='name'||LK.mode==='forgot')return;
  if(LK.pin.length>=4)return;
  LK.pin+=d;updatePlates();setMsg('');
  if(LK.pin.length===4){LK.busy=true;setTimeout(submitPin,280)}
}
function delDigit(){
  if(!LK.show||LK.busy||LK.mode==='name'||LK.mode==='forgot')return;
  LK.pin=LK.pin.slice(0,-1);updatePlates();
}
function wrong(msg){
  shakeBell();setMsg(msg,true);
  setTimeout(function(){LK.pin='';LK.busy=false;updatePlates()},520);
}
function submitPin(){
  var pin=LK.pin;
  if(LK.mode==='setup'){
    LK.first=pin;LK.mode='confirm';LK.pin='';LK.busy=false;renderLock();return;
  }
  if(LK.mode==='confirm'){
    if(pin!==LK.first){LK.first='';LK.mode='setup';wrong('Os PINs não coincidem. Tenta outra vez.');setTimeout(function(){if(LK.show&&LK.mode==='setup')renderLock('Cria um PIN novo.')},620);return}
    var salt=uid();
    hashPin(pin,salt).then(function(h){A={name:A&&A.name||'',salt:salt,hash:h};saveAuth();unlockOK()});
    return;
  }
  hashPin(pin,A.salt).then(function(h){
    if(h===A.hash){LK.fails=0;unlockOK()}
    else{
      LK.fails++;
      if(LK.fails>=5){LK.until=Date.now()+30000;LK.fails=0;wrong('Demasiadas tentativas. Espera 30 segundos.');setTimeout(function(){LK.until=0;setMsg('')},30000)}
      else wrong('PIN errado.');
    }
  });
}
function unlockOK(){
  LK.lift=true;var el=$('#lock');if(el)el.classList.add('lift');
  setTimeout(function(){LK.show=false;LK.lift=false;LK.pin='';LK.first='';LK.busy=false;renderLock();renderApp();window.scrollTo(0,0)},780);
}
function nameGo(){
  var v=(($('#lk-name')||{}).value||'').trim();
  if(!v){var ni=$('#lk-name');if(ni){ni.focus()}return}
  A={name:v,salt:'',hash:''};LK.mode='setup';LK.pin='';renderLock();
}
function lockNow(){
  if(!A)return;
  LK.show=true;LK.mode='login';LK.pin='';LK.busy=false;LK.lift=false;renderLock();
}
function resetAll(){
  try{localStorage.removeItem(AKEY);localStorage.removeItem(KEY)}catch(e){}
  S={workouts:[],templates:[],custom:[],settings:{rest:90},active:null};rest=null;renderRest();
  A=null;LK={show:true,mode:'name',pin:'',first:'',fails:0,until:0,busy:false,lift:false};renderLock();
}
function initLock(){
  loadAuth();
  LK.show=true;LK.mode=A?'login':'name';renderLock();
}

load();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
renderApp();
initLock();
setInterval(tick,250);
})();
</script>
