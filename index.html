<title>Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060607;--card:#131315;--card2:#1B1B1F;--ink:#F4F2F0;--muted:#9B9BA3;--line:#2A2A30;
  --plate:#E0202B;--plate-ink:#FFFFFF;--pr:#FF5A62;--ok:#2FBF8A;--okbg:#0E3A2C;--okline:#1F7A58;
  --navy:#0C2347;--navy2:#1B4A94;--blue:#7DAEFF;--green:#0F3D2E;
  --fd:"Barlow Condensed","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --fb:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.4}
body{min-height:100%;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 190px}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 0 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.hdr .grow{flex:1;min-width:0}
h1{font-family:var(--fd);font-weight:700;font-size:38px;line-height:1;margin:0;letter-spacing:.2px}
h2{font-family:var(--fd);font-weight:600;font-size:24px;margin:26px 0 10px}
.sub{margin:6px 0 0;color:var(--muted);font-size:15px}
.hint{color:var(--muted);margin:18px 0}
.title-in{font-family:var(--fd);font-weight:700;font-size:34px;line-height:1.05;width:100%;background:none;border:0;border-bottom:2px solid var(--line);padding:0 0 2px;border-radius:0}
.title-in:focus{outline:none;border-bottom-color:var(--plate)}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--muted);flex:none}
.icon:active{background:var(--line)}
.icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;font-size:16px;background:var(--card);border:1.5px solid var(--line)}
.btn.primary{background:var(--plate);border-color:var(--plate);color:var(--plate-ink)}
.btn.ghost{border-style:dashed;background:none;color:var(--plate);border-color:var(--plate)}
.btn.danger{background:var(--pr);border-color:var(--pr);color:#fff}
.btn.danger-ghost{background:none;color:var(--pr);border-color:transparent}
.btn.small{min-height:38px;padding:0 14px;font-size:15px}
.btn.big{width:100%;min-height:54px;font-size:18px;margin:6px 0}
.btn:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.tpl{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tpl .acts{display:flex;align-items:center;gap:4px;flex:none}
.tpl b{display:block;font-size:17px}
.meta{display:block;color:var(--muted);font-size:14px}
.exhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.exname{font-family:var(--fd);font-weight:700;font-size:24px;line-height:1.1;text-align:left}
.last{color:var(--muted);font-size:14px;margin:2px 0 0}
.setrow,.sethead{display:grid;grid-template-columns:30px 1fr 74px 66px 46px;gap:8px;align-items:center;padding:4px 6px;border-radius:12px}
.sethead{color:var(--muted);font-size:13px;padding-bottom:0}
.sethead span{text-align:center}
.setrow.done{background:var(--okbg);box-shadow:inset 0 0 0 1px var(--okline)}
.sn{font-family:var(--fd);font-weight:700;font-size:20px;text-align:center;color:var(--muted)}
.prev{font-size:14px;color:var(--muted);text-align:center;min-height:40px;border-radius:8px}
.num{width:100%;height:42px;text-align:center;font-family:var(--fd);font-weight:600;font-size:22px;background:var(--bg);border:1.5px solid transparent;border-radius:10px}
.num:focus{outline:none;border-color:var(--plate)}
.num::placeholder{color:var(--muted);opacity:.6}

var L={t:36,ua:19,fa:17,th:31,sh:31,ft:10,hd:12};
function dv(a){var r=a*Math.PI/180;return [Math.sin(r),Math.cos(r)]}
function add(o,l,a){var v=dv(a);return [o[0]+l*v[0],o[1]+l*v[1]]}
function joints(p){
  var P=p.p,N=add(P,L.t,p.t),H=add(N,L.hd,p.hd!=null?p.hd:p.t);
  var E=add(N,L.ua,p.ua),W=add(E,L.fa,p.fa);
  var K=add(P,L.th,p.th),A=add(K,L.sh,p.sh),T=add(A,L.ft,p.ft!=null?p.ft:90);
  var r={P:P,N:N,H:H,E:E,W:W,K:K,A:A,T:T};
  if(p.th2!=null){var K2=add(P,L.th,p.th2),A2=add(K2,L.sh,p.sh2),T2=add(A2,L.ft,p.ft2!=null?p.ft2:90);r.K2=K2;r.A2=A2;r.T2=T2}
  return r;
}
function pt(a){return a[0].toFixed(1)+' '+a[1].toFixed(1)}
function f1(n){return n.toFixed(1)}
function lerp(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}
function ln(cls,a,b,w){return '<line class="'+cls+'" x1="'+f1(a[0])+'" y1="'+f1(a[1])+'" x2="'+f1(b[0])+'" y2="'+f1(b[1])+'"'+(w?' style="stroke-width:'+w+'"':'')+'/>'}
function cir(cls,c,r){return '<circle class="'+cls+'" cx="'+f1(c[0])+'" cy="'+f1(c[1])+'" r="'+r+'"/>'}
function chain(pts,ws,cs){
  var s='',i;
  for(i=0;i<ws.length;i++)s+=ln('out',pts[i],pts[i+1],ws[i]+4);
  for(i=0;i<ws.length;i++)s+=ln(cs[i],pts[i],pts[i+1],ws[i]);
  return s;
}
function pad(a,b,w){return ln('padb',a,b,w+2.5)+ln('padf',a,b,w)}
function stackSVG(x,y,w,h,sel){
  var n=Math.max(4,Math.round(h/9)),ph=(h-4)/n,s='<rect class="stkf" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="2"/>';
  for(var i=0;i<n;i++)s+='<rect class="'+(i===sel?'pinp':'stp')+'" x="'+(x+2)+'" y="'+(y+2+i*ph).toFixed(1)+'" width="'+(w-4)+'" height="'+(ph-1.4).toFixed(1)+'" rx="1"/>';
  return s;
}
function sceneSVG(ex,j){
  var sc=ex.scene,W=j.W,m,s='<line class="floor" x1="8" y1="132" x2="192" y2="132"/>';
  if(!sc)return s;
  var seat=function(){return pad([84,106],[128,106],8)+pad([91,106],[91,54],9)+ln('fr1',[104,111],[104,131])};
  if(sc==='mat'){s+='<rect class="mat" x="14" y="132" width="172" height="5" rx="2.5"/>'}
  else if(sc==='bench'){s+=ln('fr1',[66,118],[66,131])+ln('fr1',[112,118],[112,131])+ln('fr2',[56,132],[78,132])+ln('fr2',[100,132],[124,132])+pad([52,113],[124,113],9)}
  else if(sc==='incline'){s+=ln('fr1',[126,114],[126,131])+ln('fr1',[98,92],[104,131])+ln('fr2',[92,132],[140,132])+pad([112,111],[142,111],8)+pad([116,108],[92,74],9)}
  else if(sc==='seatback'){s+=ln('fr2',[84,132],[124,132])+seat()}
  else if(sc==='hipbench'){s+=ln('fr1',[44,118],[44,131])+ln('fr1',[76,118],[76,131])+ln('fr2',[34,132],[86,132])+pad([34,113],[86,113],9)}
  else if(sc==='pullbar'){s+=ln('fr2',[58,132],[78,132])+ln('fr2',[140,132],[160,132])+ln('fr1',[68,-6],[68,131])+ln('fr1',[150,-6],[150,131])+ln('mt',[64,-6],[154,-6],4)}
  else if(sc==='dips'){s+=ln('fr2',[W[0]-16,132],[W[0]+16,132])+ln('fr1',[W[0],W[1]+4],[W[0],131])+cir('mtc',W,3.6)}
  else if(sc==='rack'){s+=ln('fr1',[134,16],[134,131])+ln('fr2',[124,132],[152,132])+ln('mt',[134,40],[116,40],3.2)+ln('mt',[134,104],[114,104],3.2)}
  else if(sc==='smith'){var c=[j.N[0]-4,j.N[1]+2];s+=ln('fr1',[118,-22],[118,131])+ln('fr2',[108,132],[130,132])+ln('mt',c,[118,c[1]],3)}
  else if(sc.indexOf('mach:')===0){
    m=sc.slice(5);
    s+=stackSVG(16,22,20,100,3)+ln('fr2',[44,12],[44,131])+ln('fr2',[12,132],[154,132])+ln('cab',[36,26],[44,12]);
    if(m==='calf')s+=pad([84,106],[128,106],8)+ln('fr1',[104,111],[104,131]);else s+=seat();
    if(m==='fly'){var pv=[96,44];s+=ln('cab',[44,12],pv)+ln('fr1',pv,W,4)+pad(j.E,W,7)+cir('mtc',pv,3.5)}
    else if(m==='press'){var pv2=[84,80];s+=ln('cab',[44,12],pv2)+ln('fr1',pv2,W,4)+cir('mtc',W,3.2)}
    else if(m==='shoulder'){var pv3=[86,50];s+=ln('cab',[44,12],pv3)+ln('fr1',pv3,W,4)+cir('mtc',W,3.2)}
    else if(m==='pulldown'){s+=ln('fr1',[44,-16],[96,-16])+cir('pull',[96,-16],5)+ln('cab',[96,-16],W)+ln('mt',[W[0]-7,W[1]],[W[0]+7,W[1]],3)+pad([118,88],[142,88],5)}
    else if(m==='legext'||m==='legcurl'){s+=ln('cab',[44,12],[112,104])+ln('fr1',[112,104],j.A,3.5)+cir('padf',j.A,5.5)}
    else if(m==='calf'){s+=pad([122,86],[142,86],6)+ln('fr1',[124,127],[154,127],5)+ln('fr2',[140,128],[140,131])}
  }
  else if(sc.indexOf('cable:')===0){
    m=sc.slice(6);
    var pl={high:[160,-14],face:[160,22],low:[160,116],top:[156,-22],row:[160,116]}[m]||[160,0];
    s+=stackSVG(172,-20,18,128,4)+ln('fr2',[168,-26],[168,131])+ln('fr2',[160,132],[194,132])+cir('pull',pl,5)+ln('cab',pl,W)+cir('mtc',W,2.8);
    if(m==='row')s+=ln('fr1',[152,100],[152,130],4)+pad([56,124],[100,124],8)+ln('fr1',[70,128],[70,131]);
  }
  return s;
}
function hlSVG(ex,j,fr){
  var g=ex.group,r=fr.t*Math.PI/180,n=[-Math.cos(r),Math.sin(r)],s='';
  var off=function(a,k){return [a[0]+n[0]*k,a[1]+n[1]*k]};
  if(g==='Peito')s=ln('hl',off(lerp(j.N,j.P,.1),3.5),off(lerp(j.N,j.P,.5),3.5),10);
  else if(g==='Costas')s=ln('hl',off(lerp(j.N,j.P,.06),-3.5),off(lerp(j.N,j.P,.78),-3.5),10);
  else if(g==='Core')s=ln('hl',off(lerp(j.N,j.P,.5),3.5),off(lerp(j.N,j.P,.95),3.5),10);
  else if(g==='Ombros')s=cir('hlc',j.N,7);
  else if(g==='Braços')s=ln('hl',j.N,j.E,6)+ln('hl',j.E,j.W,5);
  else if(g==='Pernas')s=ln('hl',j.P,j.K,8)+ln('hl',j.K,j.A,6);
  return s;
}
function bodySVG(ex,j,fr){
  var s='',hd=fr.hd!=null?fr.hd:fr.t;
  if(j.K2)s+=chain([j.P,j.K2,j.A2,j.T2],[11,8.5,6],['far','far','farshoe']);
  s+=chain([j.P,j.N],[15],['trunk']);
  s+=chain([j.P,j.K,j.A,j.T],[11,8.5,6],['leg','leg','shoe']);
  s+=chain([j.N,add(j.N,7,hd)],[6],['trunk']);
  s+=cir('head',j.H,8);
  s+=chain([j.N,j.E,j.W],[8,7],['arm','arm'])+cir('hand',j.W,3.6);
  return s+hlSVG(ex,j,fr);
}
function eqSVG(ex,j){
  var q=ex.eq,s='';
  if(!q)return s;
  var plate=function(c,r){return cir('plate',c,r)+cir('plate2',c,Math.round(r*0.55))+cir('hub',c,2.6)};
  if(q.k==='bar')s=plate(j.W,q.r);
  else if(q.k==='neck')s=plate([j.N[0]-4,j.N[1]+2],q.r);
  else if(q.k==='front')s=plate([j.N[0]+6,j.N[1]+3],q.r);
  else if(q.k==='hip')s=plate(j.P,q.r);
  else if(q.k==='db'){var x=j.W[0]-8,y=j.W[1]-4.5;s='<rect class="dbh" x="'+f1(x)+'" y="'+f1(y)+'" width="16" height="9" rx="2.5"/><rect class="dbp" x="'+f1(x)+'" y="'+f1(y)+'" width="4.5" height="9" rx="1.5"/><rect class="dbp" x="'+f1(x+11.5)+'" y="'+f1(y)+'" width="4.5" height="9" rx="1.5"/>'}
  else if(q.k==='dbv'){var x2=j.W[0]-4.5,y2=j.W[1]-8;s='<rect class="dbh" x="'+f1(x2)+'" y="'+f1(y2)+'" width="9" height="16" rx="2.5"/><rect class="dbp" x="'+f1(x2)+'" y="'+f1(y2)+'" width="9" height="4.5" rx="1.5"/><rect class="dbp" x="'+f1(x2)+'" y="'+f1(y2+11.5)+'" width="9" height="4.5" rx="1.5"/>'}
  return s;
}
function figSVG(ex,i){
  var fr=ex.frames[i],j=joints(fr),labels=ex.labels||['Posição inicial','Posição final'];
  return '<svg class="fig" viewBox="0 -34 200 180" role="img" aria-label="'+esc(ex.name+' – '+labels[i])+'">'+sceneSVG(ex,j)+bodySVG(ex,j,fr)+eqSVG(ex,j)+'</svg>';
}

function eqOf(c){
  if(!c)return null;
  var k=c.charAt(0),r=+c.slice(1);
  if(c==='d')return {k:'db'};
  if(c==='dv')return {k:'dbv'};
  return {k:{b:'bar',n:'neck',f:'front',h:'hip'}[k],r:r};
}

  if(tpl==='seatohpress')return eq?'seatback':'mach:shoulder';
  if(tpl==='curl')return eq?null:'cable:low';
  return M[tpl]||TP[tpl].scene;
}
function X(id,name,group,muscles,tpl,eq,steps,tips,labels){

}

X('hollow','Hollow hold','Core','Reto abdominal, core','hollow','','Deita-te de costas, com os braços esticados por cima da cabeça.|Levanta os ombros e as pernas, mantendo a zona lombar colada ao chão.|Aguenta a posição durante o tempo definido.','Se for difícil, dobra um pouco os joelhos.'),
X('roda','Roda abdominal','Core','Reto abdominal, ombros, core','wheel','b13','De joelhos, segura a roda com os braços esticados à frente.|Rola devagar para a frente, mantendo o corpo em linha reta.|Volta à posição inicial, contraindo o abdómen.','Só vai até onde consegues manter a zona lombar direita.'),
X('crunch-cabo','Crunch no cabo','Core','Reto abdominal','','','De joelhos, de frente para a roldana alta, segura a corda junto à cabeça.|Dobra o tronco para baixo, contraindo o abdómen.|Volta devagar.','O movimento vem do abdómen e não da anca.'),
X('reverse-crunch','Abdominais inversos','Core','Abdominais inferiores','revcrunch','','Deita-te de costas, com os joelhos fletidos sobre a anca.|Levanta a anca do chão, levando os joelhos em direção ao peito.|Desce devagar.','Evita balançar as pernas para ganhar impulso.'),
X('pallof','Pallof press','Core','Oblíquos, core (anti-rotação)','','','De lado para a roldana, segura a pega junto ao peito.|Estica os braços à frente, sem deixar o tronco rodar.|Volta devagar.','O objetivo é resistir à rotação.'),
X('superman','Superman','Core','Lombar, glúteos','superman','','Deita-te de barriga para baixo, com os braços esticados à frente.|Levanta ao mesmo tempo o peito, os braços e as pernas.|Faz uma pausa e desce devagar.','Mantém o olhar no chão para o pescoço ficar neutro.'),
X('prancha-toque','Prancha com toque no ombro','Core','Core, ombros','','','Em posição de flexão, com os pés um pouco afastados.|Leva uma mão ao ombro oposto, sem rodar a anca.|Alterna os lados.','Quanto mais afastados os pés, mais fácil manter o equilíbrio.'),
X('windshield','Limpa-para-brisas','Core','Oblíquos, abdominais','','','Deita-te de costas com os braços abertos e as pernas na vertical.|Leva as pernas para um lado sem tocar no chão.|Volta ao centro e passa para o outro lado.','Se for difícil, dobra os joelhos.')
];
EXS=EXS.concat(NEWX);
EXS.forEach(function(x){if(x.id==='flexoes'||x.id==='prancha'||x.id==='abdominais')x.scene='mat';if(x.id==='agachamento')x.scene='rack'});
/* ---------- inglês (English) ---------- */
var EXEN={
'supino-barra':['Barbell bench press','Chest, triceps, front deltoid','Lie on the bench with your eyes under the bar, feet flat on the floor, shoulder blades together and down.|Grip the bar slightly wider than shoulder width and unrack it with straight arms.|Lower the bar under control until it lightly touches the middle of your chest, with your elbows at about 45° from your torso.|Press the bar up until your arms are straight, without lifting your back or hips off the bench.','Keep your wrists in line with your forearms.|With heavy loads, train with a spotter or use safety bars.|Do not bounce the bar off your chest.'],
'supino-halt':['Dumbbell bench press','Chest, triceps, front deltoid','Sit on the bench with the dumbbells resting on your thighs and lie back, bringing them to chest height.|With your palms facing your feet, press the dumbbells up until your arms are straight.|Lower slowly until your elbows are a little below the bench line and you feel your chest stretch.|Press back up without clanging the dumbbells together at the top.','Keep your shoulder blades together throughout the movement.|Dumbbells allow a longer range of motion than the barbell: start with a lighter load.'],
'flexoes':['Push-ups','Chest, triceps, shoulders, core','Place your hands on the floor, slightly wider than your shoulders, with your body in a straight line from head to heels.|Brace your abs and glutes so your hips neither sag nor rise.|Lower until your chest is close to the floor, with your elbows at about 45° from your torso.|Push the floor away until your arms are straight.','If it is too hard, rest your knees on the floor while keeping your body in a line.|Look at a point slightly ahead of your hands without letting your neck drop.'],
'remada-barra':['Barbell bent-over row','Lats, trapezius, rhomboids, biceps','Feet hip-width apart, knees slightly bent, and lean your torso forward (about 45°) with a neutral spine.|Grip the bar slightly wider than shoulder width with your arms straight.|Pull the bar towards your abdomen, driving your elbows back and squeezing your shoulder blades together.|Pause briefly, then lower the bar slowly.','Do not round your spine or swing your torso to lift the weight.|Look at the floor, a little ahead, to keep your neck aligned.'],
'barra-fixa':['Pull-up','Lats, biceps, forearms, core','Grip the bar with your palms facing forward, slightly wider than shoulder width, and hang with straight arms.|Pull your shoulders away from your ears, engaging your back before you pull.|Drive your elbows down and back until your chin passes the bar.|Lower under control until your arms are straight.','Avoid swinging your body for momentum.|If you cannot do full reps yet, use a resistance band or the assisted machine.'],
'terra':['Deadlift','Hamstrings, glutes, lower back, trapezius','Feet hip-width apart with the bar over the middle of your foot, close to your shins.|Grip the bar with straight arms, chest open and spine neutral.|Push the floor away with your feet, extending your hips and knees together, keeping the bar close to your legs.|At the top, stand tall without leaning back. Lower by sending your hips back first and then bending your knees.','Never round your lower back.|Increase the load gradually and ask a coach to review your technique.'],
'agachamento':['Barbell squat','Quads, glutes, hamstrings, core','Place the bar on your upper back (over your trapezius), with feet shoulder-width apart and toes slightly turned out.|Take a deep breath, brace your abs, and descend by sending your hips back and down.|Keep your knees in line with your toes and go down until your thighs are parallel to the floor, or as far as you can keep a neutral spine.|Stand up by pushing the floor away with your whole foot.','Keep your heels on the floor.|Train inside a rack with safety bars.'],
'afundo':['Dumbbell lunge','Quads, glutes, hamstrings','Stand with a dumbbell in each hand at your sides.|Take a big step forward and lower straight down until both knees are at about 90°.|Your back knee gets close to the floor and your torso stays upright.|Push off your front foot to return to the start and alternate legs.','Keep your front knee in line with your foot, not collapsing inwards.'],
'gemeos':['Calf raise','Gastrocnemius and soleus','Stand with feet hip-width apart (you can place the balls of your feet on a step).|Rise as high as you can, pushing through the balls of your feet.|Pause for one second at the top.|Lower slowly until you feel your calf stretch.','Keep your knees almost straight and your body upright.|Use the full range of motion: the stretch at the bottom counts.'],
'press-ombros':['Dumbbell shoulder press','Deltoids, triceps, upper trapezius','Standing or seated, hold the dumbbells at shoulder height with your elbows slightly in front of your body.|Brace your abs and glutes.|Press the dumbbells overhead until your arms are straight.|Lower under control back to the start.','Do not arch your lower back too much to press.'],
'curl':['Dumbbell biceps curl','Biceps and brachialis','Stand with the dumbbells at your sides and your palms facing forward.|Keep your elbows against your torso and bend them, curling the dumbbells up to your shoulders.|Squeeze your biceps at the top for a moment.|Lower slowly until your arms are straight.','Do not swing your torso to lift the weight: if needed, reduce the load.'],
'triceps-halter':['Dumbbell triceps extension','Triceps','Standing or seated, hold a dumbbell with both hands overhead.|Bend your elbows to lower the dumbbell behind your head, with your elbows pointing up.|Extend your arms to return to the start.','Keep your elbows fixed and close together.|Use a moderate load to protect your elbows.'],
'prancha':['Plank','Abs, glutes, shoulders','Rest your forearms on the floor with your elbows under your shoulders and the balls of your feet on the floor.|Form a straight line from head to heels, bracing your abs and glutes.|Breathe normally and hold for 20 to 60 seconds.','Avoid letting your hips sag or rise too high.|Stop when you lose position, even if you have not reached the time.'],
'abdominais':['Crunches','Rectus abdominis','Lie on your back with your knees bent and feet on the floor.|Place your hands by your temples or crossed on your chest.|Brace your abs and lift your shoulders and upper back off the floor.|Lower under control, without dropping your head down suddenly.','The movement is short: do not pull on your neck with your hands.'],
'supino-inc-barra':['Incline barbell bench press','Upper chest, front deltoid, triceps','Set the bench between 30° and 45° and lie back with your feet flat on the floor.|Unrack the bar and lower it under control to your upper chest.|Press the bar up until your arms are straight, keeping your shoulder blades on the bench.','Above 45° the shoulders work more than the chest.|Keep your wrists in line with your forearms.'],
'supino-inc-halt':['Incline dumbbell bench press','Upper chest, front deltoid, triceps','With the bench at 30°–45°, bring the dumbbells to chest height with your palms facing forward.|Press them up until your arms are straight, without clanging them together.|Lower slowly until you feel your chest stretch.','Choose a load you can control without swinging the dumbbells.'],
'supino-fechado':['Close-grip bench press','Triceps, chest, front deltoid','Lie on the bench and grip the bar with your hands shoulder-width apart (or slightly closer).|Lower the bar to your chest with your elbows close to your torso.|Press up until your arms are straight.','Do not bring your hands too close together: it overloads the wrists.|Keep your shoulder blades together and your back on the bench.'],
'press-neutro':['Neutral-grip dumbbell press','Chest, triceps','Lie back with the dumbbells by your chest and your palms facing each other.|Press up until your arms are straight.|Lower under control, keeping your elbows close to your body.','A good option if the standard grip bothers your shoulders.'],
'floor-press':['Dumbbell floor press','Chest, triceps','Lie on the floor with your knees bent and the dumbbells beside your chest.|Press them up until your arms are straight.|Lower until your elbows lightly touch the floor and repeat.','The floor limits the range of motion and protects your shoulders.|Do not let your elbows fully rest on the floor between reps.'],
'crucifixo':['Dumbbell fly','Chest','Lie on the bench with the dumbbells above your chest and your elbows slightly bent.|Open your arms in an arc, lowering the dumbbells until you feel your chest stretch.|Close the arc, bringing the dumbbells back above your chest.','Use light weight and controlled movement: it is an isolation exercise.|Keep the same elbow angle throughout.'],
'crucifixo-inc':['Incline dumbbell fly','Upper chest','With the bench inclined, hold the dumbbells above your chest with your elbows slightly bent.|Open your arms in an arc until you feel the stretch.|Bring the dumbbells back together at the top.','Do not go too low: your limit is shoulder comfort.'],
'pullover':['Dumbbell pullover','Chest, lats, triceps (long head)','Lie on your back on the bench and hold a dumbbell with both hands above your chest.|With your arms almost straight, lower the dumbbell in an arc behind your head.|Return to the start using your chest and back.','Keep your hips low and your abs braced.'],
'flexoes-diamante':['Diamond push-ups','Triceps, chest, shoulders','Place your hands together under your chest, with your thumbs and index fingers forming a diamond.|Lower your chest to your hands, keeping your elbows close to your body.|Push the floor away until your arms are straight.','If it is too hard, do them on your knees.'],
'flexoes-largas':['Wide-grip push-ups','Chest, shoulders','Place your hands wider than your shoulders and keep your body in a straight line.|Lower your chest to the floor under control.|Push the floor away to return to the start.','Do not let your hips sag or rise.'],
'flexoes-declinadas':['Decline push-ups','Upper chest, shoulders','Rest your feet on a bench and your hands on the floor, with your body in a straight line.|Lower your chest towards the floor with your elbows at about 45°.|Push the floor away until your arms are straight.','The higher the foot support, the more load on the shoulders.'],
'fundos-paralelas':['Parallel bar dips','Lower chest, triceps, front deltoid','Support yourself on the bars with straight arms and your torso leaning slightly forward.|Bend your elbows and lower until you feel your chest stretch.|Push the bars away to straighten your arms again.','Do not go lower than your shoulders comfortably allow.|If it is too hard, use the assisted machine.'],
'crossover':['Cable crossover','Chest','Stand between two high pulleys, holding a handle in each hand with your elbows slightly bent.|Bring your hands together in front of your chest in an arc.|Return slowly until you feel your chest stretch.','Lean your torso slightly forward and keep it still.|Control the return: do not let the weights slam.'],
'peck-deck':['Pec deck (machine fly)','Chest','Sit with your back against the pad and your forearms resting on the arm pads.|Bring your arms together in front of your chest without shrugging your shoulders.|Open slowly until you feel your chest stretch.','Adjust the seat so your hands are at chest height.'],
'press-maq-peito':['Machine chest press','Chest, triceps','Sit with your back well supported and the handles at chest height.|Press the handles forward until your arms are straight.|Return slowly until you feel your chest stretch.','Do not lock your elbows hard at the end.'],
'supino-declinado':['Decline barbell bench press','Lower chest, triceps','Lie on a decline bench with your feet secured and grip the bar at shoulder width or slightly wider.|Lower the bar to your lower chest.|Press up until your arms are straight.','Get a spotter to unrack and rack the bar with heavy loads.'],
'remada-halt':['Dumbbell bent-over row','Lats, trapezius, rhomboids, biceps','With your knees slightly bent, lean your torso forward and hold a dumbbell in each hand.|Pull the dumbbells towards your hips, driving your elbows back.|Lower slowly until your arms are straight.','Keep a neutral spine and your neck aligned.'],
'remada-t':['T-bar row','Lats, trapezius, rhomboids','Stand over the bar with your knees bent and your torso leaning forward, and grip the handle.|Pull the bar towards your chest, squeezing your shoulder blades together.|Lower under control.','Do not swing your torso to lift the weight.'],
'remada-unilateral':['One-arm dumbbell row','Lats, rhomboids, biceps','Rest one hand and the knee on the same side on a bench, with your back straight.|With the other hand, pull the dumbbell towards your hip, driving your elbow back.|Lower slowly and repeat, switching sides at the end of the set.','Keep your shoulders parallel to the floor, without rotating your torso.'],
'remada-sentada':['Seated cable row','Lats, rhomboids, trapezius','Sit with your feet braced and your knees slightly bent, and grab the handle with straight arms.|Pull the handle to your abdomen, squeezing your shoulder blades together.|Return slowly until your arms are straight.','Keep your torso upright, without leaning back.'],
'chin-up':['Chin-up','Lats, biceps, forearms','Grip the bar with your palms facing you, shoulder-width apart, and hang.|Pull your elbows down until your chin passes the bar.|Lower under control until your arms are straight.','This grip works the biceps more than the standard one.'],
'barra-assistida':['Assisted pull-up','Lats, biceps','Use the assisted machine or a band and grab the bar.|Pull your elbows down until your chin passes the bar.|Lower slowly until your arms are straight.','Reduce the assistance over time.'],
'puxada-alta':['Lat pulldown','Lats, biceps, teres major','Sit with your thighs secured under the pad and grip the bar slightly wider than your shoulders.|Pull the bar to your chest, driving your elbows down and back.|Return slowly until your arms are straight.','Lean your torso slightly back, without swinging.'],
'puxada-neutra':['Neutral-grip pulldown','Lats, biceps','Sit and grab the handle with your palms facing each other.|Pull to your chest, keeping your elbows close to your body.|Return slowly until your arms are straight.','A good option if the wide grip bothers your shoulders.'],
'puxada-bracos-retos':['Straight-arm cable pulldown','Lats, triceps (long head)','Standing facing the high pulley, hold the bar with straight arms and your torso leaning slightly forward.|Pull the bar down to your thighs, keeping your arms almost straight.|Return slowly to the start.','Do not bend your elbows: the movement comes from the shoulder.'],
'good-morning':['Good morning','Lower back, hamstrings, glutes','With the bar on your back, feet shoulder-width apart and knees slightly bent.|Send your hips back and lean your torso forward, keeping a neutral spine.|Return to the start by driving your hips forward.','Use light weight: technique comes first.|Go down only as far as you can keep your back straight.'],
'remada-invertida':['Inverted row','Lats, rhomboids, biceps','Lie under a low bar and grip it with your hands shoulder-width apart.|With your body in a straight line, pull your chest to the bar.|Lower slowly until your arms are straight.','The more horizontal your body, the harder it is.'],
'hiperextensao':['Back extensions','Lower back, glutes, hamstrings','Position yourself on the bench with your hips supported and your ankles secured.|Lower your torso under control, with your back straight.|Raise until your body is in a straight line, without over-arching.','Do not go above the line of your body.'],
'encolhimentos':['Dumbbell shrugs','Upper trapezius','Stand holding a dumbbell in each hand at your sides.|Raise your shoulders towards your ears without bending your elbows.|Pause, then lower slowly.','Do not roll your shoulders: the movement is only up and down.'],
'remada-apoiada':['Chest-supported row','Lats, rhomboids, trapezius','Lie face down on an incline bench, holding a dumbbell in each hand.|Pull the dumbbells towards your ribs, squeezing your shoulder blades together.|Lower slowly until your arms are straight.','The bench support prevents swinging your torso.'],
'terra-sumo':['Sumo deadlift','Glutes, thighs, lower back, trapezius','Place your feet wider than your shoulders, toes turned out, and grip the bar inside your legs.|Push the floor away with your feet and extend your hips and knees together.|Stand tall at the top and lower under control.','Keep your knees in line with your toes.|Increase the load gradually.'],
'remada-pendlay':['Pendlay row','Lats, trapezius, lower back','With your torso parallel to the floor, grip the bar resting on the floor.|Pull the bar explosively to your abdomen.|Set it back on the floor and repeat.','Keep your torso parallel to the floor on every rep.'],
'agach-frontal':['Front squat','Quads, glutes, core','Rest the bar across the front of your shoulders, with your elbows high.|Descend under control with an upright torso until your thighs are parallel to the floor.|Stand up by pushing the floor away with your whole foot.','Keep your elbows high so the bar does not roll.'],
'goblet':['Goblet squat','Quads, glutes, core','Hold a dumbbell against your chest with both hands.|Descend between your knees, keeping your torso upright.|Stand up by pushing through your heels.','A great exercise for learning the squat.'],
'sumo-halt':['Dumbbell sumo squat','Glutes, adductors, quads','With your feet wide and toes turned out, hold a dumbbell in front of you.|Descend with an upright torso and your knees in line with your toes.|Stand up squeezing your glutes.','Do not let your knees cave inwards.'],
'avanco-reverso':['Reverse lunge','Quads, glutes, hamstrings','Standing with a dumbbell in each hand, step back with one leg.|Lower until your back knee almost touches the floor.|Return to the start and alternate legs.','It is easier on the knees than the forward lunge.'],
'passada':['Walking lunge with dumbbells','Quads, glutes, hamstrings','Take a big step forward and lower until both knees are at 90°.|Push off your front foot to take the next step.|Alternate legs as you walk.','Keep your torso upright and your steps long.'],
'bulgaro':['Bulgarian split squat','Quads, glutes','Rest the top of your back foot on a bench and step the other leg forward.|Lower straight down until your front thigh is parallel to the floor.|Stand up by pushing through your front foot.','Complete all reps on one side before switching.'],
'step-up':['Step-up','Quads, glutes','Facing a bench, place one whole foot on top.|Step up by pushing through the top leg until you stand tall.|Lower under control and repeat.','Avoid pushing off with the bottom leg.'],
'terra-romeno':['Romanian deadlift','Hamstrings, glutes, lower back','Standing with the bar in front of your thighs and your knees slightly bent.|Send your hips back and lower the bar close to your legs.|Return to the start by extending your hips.','Keep a neutral spine.|Go down only until you feel your hamstrings stretch.'],
'stiff-halt':['Dumbbell stiff-leg deadlift','Hamstrings, glutes','Standing with a dumbbell in each hand in front of your thighs.|Send your hips back and lower the dumbbells close to your legs.|Rise squeezing your glutes.','Keep your knees almost straight but not locked.'],
'hip-thrust':['Hip thrust','Glutes, hamstrings','Rest your upper back on a bench, with the bar across your hips and your feet on the floor.|Push the floor away with your feet and raise your hips until your body forms a straight line.|Squeeze your glutes at the top and lower under control.','Use a pad on the bar so it does not hurt your hips.'],
'ponte':['Glute bridge','Glutes, hamstrings','Lie on your back with your knees bent and your feet on the floor.|Raise your hips until your body forms a line from shoulders to knees.|Squeeze your glutes and lower slowly.','Do not over-arch your lower back at the top.'],
'ext-pernas':['Leg extension','Quads','Sit in the machine with the pad over your ankles.|Extend your legs until they are almost fully straight.|Lower slowly back to the start.','Control the lowering: do not let the weight drop.'],
'flexao-pernas':['Seated leg curl','Hamstrings','Sit in the machine with the pad over your ankles.|Bend your knees, bringing your heels down and back.|Return slowly to the start.','Keep your back against the seat.'],
'prensa':['Leg press','Quads, glutes','Sit with your back supported and your feet on the platform, shoulder-width apart.|Push the platform until your legs are almost straight.|Return slowly until your knees are at about 90°.','Do not lock your knees at the top and do not let your hips lift off the seat.'],
'gemeos-sentado':['Seated calf raise','Soleus (calves)','Sit with your knees at 90° and the balls of your feet on the platform.|Raise your heels as high as you can.|Lower slowly until you feel the stretch.','Pause at the top to work the muscle well.'],
'abdutores':['Hip abduction machine','Gluteus medius, abductors','Sit in the machine with your back supported and your legs against the pads.|Open your legs against the resistance.|Return slowly to the start.','Keep your torso against the pad and the movement controlled.'],
'agach-smith':['Smith machine squat','Quads, glutes','Stand under the bar with your feet slightly in front of your body.|Descend under control until your thighs are parallel to the floor.|Stand up by pushing the floor away with your whole foot.','The fixed path helps you keep good technique.'],
'press-militar':['Barbell overhead press','Deltoids, triceps, trapezius','Standing, with the bar at shoulder height and your elbows slightly in front.|Brace your abs and press the bar overhead, passing it close to your face.|Lower under control back to your shoulders.','Do not arch your back to press.'],
'arnold':['Arnold press','Deltoids, triceps','Hold the dumbbells in front of your chest with your palms facing you.|Raise them, rotating your palms forward, until your arms are straight.|Lower, rotating your palms back towards you.','Use light weight at first: the movement is more complex.'],
'press-sentado':['Seated dumbbell shoulder press','Deltoids, triceps','Sit with your back supported and the dumbbells at shoulder height.|Press them up until your arms are straight.|Lower slowly to ear level.','Back support reduces torso swing.'],
'press-maq-ombros':['Machine shoulder press','Deltoids, triceps','Sit with your back supported and the handles at shoulder height.|Press the handles up until your arms are straight.|Lower slowly.','Adjust the seat so the handles are at shoulder height.'],
'push-press':['Push press','Deltoids, triceps, legs','With the bar at shoulder height, bend your knees slightly.|Extend your legs and drive the bar overhead in one motion.|Lower under control back to your shoulders.','Use leg drive to help the bar up.'],
'elev-frontal':['Dumbbell front raise','Front deltoid','Standing with the dumbbells in front of your thighs.|Raise your straight arms to shoulder height.|Lower slowly.','Do not swing your torso to help the lift.'],
'elev-frontal-barra':['Barbell front raise','Front deltoid','Standing, hold the bar in front of your thighs.|Raise it with almost-straight arms to shoulder height.|Lower under control.','Use light weight and clean form.'],
'remada-alta':['Barbell upright row','Deltoids, trapezius','Standing, hold the bar in front of your thighs with your hands shoulder-width apart.|Pull it up close to your body to chest height, with your elbows above your hands.|Lower under control.','Do not go above chest height if your shoulders bother you.'],
'remada-alta-halt':['Dumbbell upright row','Deltoids, trapezius','Standing, hold a dumbbell in each hand in front of your thighs.|Raise them close to your body to chest height, with your elbows above your hands.|Lower slowly.','Keep the dumbbells close to your body.'],
'face-pull':['Face pull','Rear deltoid, trapezius, rhomboids','With a rope on the pulley at face height, pull it towards your face.|Drive your elbows back and up, pulling your hands apart.|Return slowly with your arms straight.','Keep your torso upright and the weight light.'],
'crucifixo-inv':['Reverse fly machine','Rear deltoid, rhomboids','Sit facing the machine with your chest supported and the handles in front.|Open your arms backwards, squeezing your shoulder blades together.|Return slowly to the start.','Do not shrug your shoulders.'],
'elev-lateral':['Dumbbell lateral raise','Side deltoid','Standing, with a dumbbell in each hand at your sides.|Raise your arms out to the sides to shoulder height, with your elbows slightly bent.|Lower slowly.','Use light weight: the side deltoid is a small muscle.'],
'elev-lateral-cabo':['Cable lateral raise','Side deltoid','Stand sideways to the low pulley and grab the cable with your far hand.|Raise your arm out to the side to shoulder height.|Lower slowly.','The cable keeps tension on the muscle through the whole movement.'],
'elev-posterior':['Dumbbell rear delt raise','Rear deltoid, rhomboids','Lean your torso forward with a straight back and the dumbbells hanging.|Open your arms out to the sides to shoulder height.|Lower slowly.','Do not use torso swing.'],
'elev-posterior-cabo':['Cable rear delt fly','Rear deltoid','Standing, cross your arms and grab the opposite cables of the high pulleys.|Open your arms out to the sides, keeping them straight.|Return slowly.','Keep the weight light and the movement clean.'],
'pike-pushup':['Pike push-ups','Deltoids, triceps','Get into an inverted V, with your hands and feet on the floor and your hips high.|Bend your elbows and lower your head towards the floor.|Push back up to the start.','The more vertical your back, the more your shoulders work.'],
'curl-barra':['Barbell curl','Biceps, brachialis','Standing, grip the bar with your palms facing forward, shoulder-width apart.|Bend your elbows and curl the bar to your shoulders without moving your elbows.|Lower slowly until your arms are straight.','Do not swing your torso to lift the weight.'],
'curl-martelo':['Hammer curl','Brachialis, brachioradialis, biceps','Standing, with the dumbbells at your sides and your palms facing each other.|Bend your elbows and curl the dumbbells to your shoulders.|Lower slowly.','Keep your elbows close to your torso.'],
'curl-alternado':['Alternating dumbbell curl','Biceps, brachialis','Standing, with a dumbbell in each hand at your sides.|Curl one dumbbell to your shoulder, slightly rotating your wrist.|Lower and repeat with the other arm.','Avoid swinging your torso.'],
'curl-cabo':['Cable curl','Biceps, brachialis','Facing the low pulley, grip the bar with your palms facing up.|Curl the bar to your shoulders without moving your elbows.|Lower slowly.','The cable keeps tension on the biceps through the whole movement.'],
'curl-inverso':['Reverse curl','Brachioradialis, forearms','Standing, grip the bar with your palms facing down.|Bend your elbows and curl the bar to your shoulders.|Lower slowly.','Use a lighter load than for the regular curl.'],
'curl-concentrado':['Concentration curl','Biceps','Sit with your legs apart and rest your elbow on the inside of your thigh.|Curl the dumbbell to your shoulder, squeezing your biceps.|Lower slowly.','Keep your upper arm still: only the forearm moves.'],
'curl-scott':['Preacher curl','Biceps (short head)','Rest your arms on the angled pad and grip the bar.|Curl the bar to your shoulders.|Lower slowly, without fully straightening your elbows at the bottom.','Not fully locking out your elbows protects the tendons.'],
'curl-inclinado':['Incline dumbbell curl','Biceps (long head)','Sit on a bench inclined at 45° with your arms hanging.|Curl the dumbbells up to your shoulders, alternating or together.|Lower slowly.','The extra stretch recruits more of the long head of the biceps.'],
'curl-spider':['Spider curl','Biceps','Lie face down on an incline bench with your arms hanging.|Bend your elbows and curl the dumbbells up.|Lower slowly.','The bench prevents any body swing.'],
'triceps-corda':['Rope triceps pushdown','Triceps','Facing the high pulley, hold the rope with your elbows close to your torso.|Push down until your arms are straight, spreading the rope slightly.|Return slowly until your elbows are at 90°.','Keep your elbows fixed against your body.'],

  if(!root)return;
  if(root.nodeType===3){trOne(root);return}

  var p=n.parentNode;
  if(p&&(p.nodeName==='TEXTAREA'||p.nodeName==='SCRIPT'||p.nodeName==='STYLE'))return;

  ['placeholder','aria-label','title'].forEach(function(a){

function TT(pt,en){return LANG==='en'?en:pt}
function pad2(n){return (n<10?'0':'')+n}
function fmtPace(sec){sec=Math.round(sec);return Math.floor(sec/60)+':'+pad2(sec%60)}
function fmtHMS(sec){sec=Math.round(sec);var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h>0?h+':'+pad2(m)+':'+pad2(s):m+':'+pad2(s)}
function fmtKm(k){return String(Math.round(k*100)/100).replace('.',LANG==='en'?'.':',')}
function fmtSpd(v){return (Math.round(v*10)/10).toFixed(1).replace('.',LANG==='en'?'.':',')}
var RB=[3,5,10,15,21.0975,42.195];
function rbName(k){return k===21.0975?TT('Meia maratona','Half marathon'):k===42.195?TT('Maratona','Marathon'):fmtKm(k)+' km'}
function bucketOf(km){for(var i=0;i<RB.length;i++){if(Math.abs(km-RB[i])/RB[i]<=0.05)return RB[i]}return 0}
function riegel(t,d1,d2){return t*Math.pow(d2/d1,1.06)}
function sortedRuns(){return S.runs.slice().sort(function(a,b){return new Date(a.date)-new Date(b.date)})}
function todayISODate(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
var runView='log',runBucket='all',rWeek=0;
var runDraft={date:todayISODate(),km:'',h:'',m:'',s:''};
var refDraft=null;
function WDAB(){return LANG==='en'?['Mon','Tue','Wed','Thu','Fri','Sat','Sun']:['Seg','Ter','Qua','Qui','Sex','Sáb','Dom']}
function prevHTML(km,sec){
  if(!(km>0&&sec>0))return '<span class="meta">'+TT('O pace médio e a velocidade aparecem aqui.','Average pace and speed appear here.')+'</span>';
  return '<b class="rp">'+fmtPace(sec/km)+'</b><span> /km</span><span class="meta">'+fmtSpd(km/(sec/3600))+' km/h</span>';
}
function draftSec(){return num(runDraft.h)*3600+num(runDraft.m)*60+num(runDraft.s)}
function updRunPrev(){var el=$('#rprev');if(el)el.innerHTML=prevHTML(num(runDraft.km),draftSec())}
function hdrRun(){return hdr(TT('Corrida','Running'),TT('Regista a distância e o tempo: o pace médio é calculado automaticamente.','Log distance and time: your average pace is calculated automatically.'))}

/* gráficos */
function paceChartSVG(pts){
  var W=340,H=170,Lm=46,R=12,T=14,B=26;
  var xs=pts.map(function(p){return p.t}),vs=pts.map(function(p){return p.v});
  var x0=Math.min.apply(0,xs),x1=Math.max.apply(0,xs);if(x0===x1){x0-=864e5*3;x1+=864e5*3}
  var v0=Math.min.apply(0,vs),v1=Math.max.apply(0,vs),pd=(v1-v0)*.25||12;v0-=pd;v1+=pd;
  var X=function(t){return Lm+(t-x0)/(x1-x0)*(W-Lm-R)},Y=function(v){return T+(v-v0)/(v1-v0)*(H-T-B)};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+TT('Gráfico de pace','Pace chart')+'">';
  for(var i=0;i<3;i++){var v=v0+(v1-v0)*i/2,y=Y(v);s+='<line class="gl" x1="'+Lm+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text class="tx2" x="'+(Lm-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+fmtPace(v)+'</text>'}
  if(pts.length>1)s+='<path class="ln" d="'+pts.map(function(p,i){return (i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.v).toFixed(1)}).join(' ')+'"/>';
  pts.forEach(function(p){s+='<circle class="'+(p.pr?'ptpr':'pt')+'" cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="4.5"/>'});
  var dl=function(t){return new Date(t).toLocaleDateString(LOC,{day:'numeric',month:'short'})};
  s+='<text class="tx2" x="'+Lm+'" y="'+(H-8)+'">'+dl(Math.min.apply(0,xs))+'</text><text class="tx2" x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+dl(Math.max.apply(0,xs))+'</text></svg>';
  return s;
}
function weekBarsSVG(vals,labels){
  var W=340,H=150,Lm=8,R=8,T=18,B=24,n=vals.length,mx=Math.max.apply(0,vals)||1,bw=(W-Lm-R)/n;
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+TT('Quilómetros por semana','Kilometres per week')+'">';
  for(var i=0;i<n;i++){
    var h=vals[i]/mx*(H-T-B),x=Lm+i*bw+bw*.18,w=bw*.64,y=H-B-h;
    s+='<rect class="bar" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(h,1).toFixed(1)+'" rx="3"/>';
    if(vals[i]>0)s+='<text class="tx2" x="'+(x+w/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle">'+fmtKm(vals[i])+'</text>';
    s+='<text class="tx2" x="'+(x+w/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+labels[i]+'</text>';
  }
  return s+'</svg>';
}

/* ecrã principal da corrida */
function corridaHTML(){
  var h=hdrRun();
  h+='<div class="chips" role="group" aria-label="'+TT('Secções da corrida','Running sections')+'">'+[['log',TT('Corridas','Runs')],['paces',TT('Ritmos','Paces')],['plans',TT('Planos','Plans')]].map(function(v){return '<button class="chip" data-act="rview" data-v="'+v[0]+'" aria-pressed="'+(runView===v[0])+'">'+v[1]+'</button>'}).join('')+'</div>';
  if(runView==='paces')return h+ritmosHTML();
  if(runView==='plans')return h+rplansHTML();

function corridasHTML(){
  var runs=sortedRuns(),h='';
  h+='<section class="card"><h3 class="ch">'+TT('Nova corrida','New run')+'</h3>'+
    '<label class="field"><span>'+TT('Data','Date')+'</span><input type="date" data-f="rdate" value="'+esc(runDraft.date)+'"></label>'+
    '<label class="field"><span>'+TT('Distância (km)','Distance (km)')+'</span><input inputmode="decimal" data-f="rkm" value="'+esc(runDraft.km)+'" placeholder="'+(LANG==='en'?'5.0':'5,0')+'"></label>'+
    '<div class="field"><span>'+TT('Tempo','Time')+'</span><div class="tri">'+
    '<label><input inputmode="numeric" data-f="rh" value="'+esc(runDraft.h)+'" placeholder="0" aria-label="'+TT('Horas','Hours')+'"><em>h</em></label>'+
    '<label><input inputmode="numeric" data-f="rm" value="'+esc(runDraft.m)+'" placeholder="0" aria-label="'+TT('Minutos','Minutes')+'"><em>min</em></label>'+
    '<label><input inputmode="numeric" data-f="rs" value="'+esc(runDraft.s)+'" placeholder="0" aria-label="'+TT('Segundos','Seconds')+'"><em>s</em></label></div></div>'+
    '<div class="rprev" id="rprev" role="status">'+prevHTML(num(runDraft.km),draftSec())+'</div>'+
    '<button class="btn primary big" data-act="run-save">'+TT('Guardar corrida','Save run')+'</button></section>';
  if(!runs.length)return h+'<p class="empty">'+TT('Ainda não registaste corridas.','You have not logged any runs yet.')+'</p>';
  var km=0,sec=0;runs.forEach(function(r){km+=r.km;sec+=r.sec});
  h+='<div class="stats"><div class="stat"><b>'+fmtKm(km)+'</b><span>'+TT('km no total','km in total')+'</span></div><div class="stat"><b>'+runs.length+'</b><span>'+TT('corridas','runs')+'</span></div><div class="stat"><b>'+fmtPace(sec/km)+'</b><span>'+TT('pace médio /km','average pace /km')+'</span></div></div>';
  /* km por semana */
  var now=new Date(),dow=(now.getDay()+6)%7,mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow).getTime(),vals=[],labs=[];
  for(var i=7;i>=0;i--){
    var a=mon-i*7*864e5,b=a+7*864e5,tot=0;
    runs.forEach(function(r){var t=new Date(r.date).getTime();if(t>=a&&t<b)tot+=r.km});
    vals.push(Math.round(tot*10)/10);labs.push(new Date(a).toLocaleDateString(LOC,{day:'numeric',month:'numeric'}));
  }
  h+='<h2>'+TT('Km por semana','Km per week')+'</h2><div class="chartbox">'+weekBarsSVG(vals,labs)+'</div>';
  /* progressão */
  var bk={};runs.forEach(function(r){var b=bucketOf(r.km);if(b)(bk[b]=bk[b]||[]).push(r)});
  if(runBucket!=='all'&&!bk[runBucket])runBucket='all';
  var sub=runBucket==='all'?runs:bk[runBucket];
  h+='<h2>'+TT('Progressão do pace','Pace progression')+'</h2><label class="field"><span>'+TT('Distância','Distance')+'</span><select data-f="rbucket"><option value="all"'+(runBucket==='all'?' selected':'')+'>'+TT('Todas as distâncias','All distances')+'</option>'+RB.filter(function(b){return bk[b]}).map(function(b){return '<option value="'+b+'"'+(String(b)===String(runBucket)?' selected':'')+'>'+rbName(b)+'</option>'}).join('')+'</select></label>';
  var pts=sub.map(function(r){return {t:new Date(r.date).getTime(),v:r.sec/r.km}}),best=Infinity;
  pts.forEach(function(p,i){p.pr=i>0&&p.v<best;if(p.v<best)best=p.v});
  if(pts.length>=2){
    var dlt=pts[pts.length-1].v-pts[0].v;
    h+='<div class="chartbox">'+paceChartSVG(pts)+'<p class="note" style="margin:6px 4px 0">'+TT('Pontos verdes: novo melhor pace. Mais alto no gráfico = mais lento.','Green dots: new best pace. Higher on the chart = slower.')+'</p></div>';
    h+='<p class="hint" style="margin:-4px 0 12px">'+(runBucket==='all'?TT('Escolhe uma distância para comparar corridas equivalentes.','Choose a distance to compare equivalent runs.'):dlt<0?TT('Desde a primeira corrida melhoraste ','Since your first run you improved by ')+fmtPace(-dlt)+' /km.':dlt>0?TT('Estás ','You are ')+fmtPace(dlt)+TT(' /km mais lento do que na primeira corrida.',' /km slower than on your first run.'):TT('O teu pace manteve-se igual.','Your pace is unchanged.'))+'</p>';
  }else h+='<p class="hint">'+TT('Regista pelo menos duas corridas da mesma distância para veres a progressão.','Log at least two runs of the same distance to see your progress.')+'</p>';
  /* recordes */
  var rec='';
  RB.forEach(function(b){
    if(!bk[b])return;
    var br=bk[b].slice().sort(function(x,y){return x.sec/x.km-y.sec/y.km})[0];
    rec+='<div class="rec"><b>'+rbName(b)+'</b><span class="v">'+fmtHMS(br.sec)+'<small>'+fmtPace(br.sec/br.km)+' /km · '+fmtDate(br.date)+'</small></span></div>';
  });
  if(rec)h+='<h2>'+TT('Recordes','Records')+'</h2><div class="card">'+rec+'</div>';
  /* lista */
  h+='<h2>'+TT('Corridas','Runs')+'</h2>';
  runs.slice().reverse().forEach(function(r){
    var b=bucketOf(r.km),isPR=b&&bk[b].length>1&&bk[b].every(function(o){return o===r||o.sec/o.km>r.sec/r.km});
    h+='<div class="card runrow"><div><b>'+fmtKm(r.km)+' km · '+fmtHMS(r.sec)+(isPR?'<span class="pill">PR</span>':'')+'</b><span class="meta">'+fmtDate(r.date)+' · '+fmtPace(r.sec/r.km)+' /km · '+fmtSpd(r.km/(r.sec/3600))+' km/h</span></div><button class="icon" data-act="run-del" data-id="'+esc(r.id)+'" aria-label="'+TT('Apagar corrida','Delete run')+'">'+ICON.trash+'</button></div>';
  });
  return h;
}

/* ritmos: conversor, previsão e tabela */
function refCalc(){
  if(!refDraft){var r=S.run.ref;refDraft=r?{d:String(r.km),h:String(Math.floor(r.sec/3600)||''),m:String(Math.floor(r.sec%3600/60)||''),s:String(Math.round(r.sec%60)||'')}:{d:'5',h:'',m:'',s:''}}
  return {km:parseFloat(refDraft.d),sec:num(refDraft.h)*3600+num(refDraft.m)*60+num(refDraft.s)};
}
function refHTML(){
  var c=refCalc();
  if(!(c.km>0&&c.sec>0))return '<p class="hint" style="margin:8px 0 0">'+TT('Escreve um tempo recente para veres previsões e ritmos de treino.','Enter a recent time to see predictions and training paces.')+'</p>';
  var p5=riegel(c.sec,c.km,5)/5,p10=riegel(c.sec,c.km,10)/10,h='<h4>'+TT('Previsão de tempos de prova','Race time predictions')+'</h4><div class="rtab">';
  [5,10,21.0975,42.195].forEach(function(d){var t=riegel(c.sec,c.km,d);h+='<div class="rec"><b>'+rbName(d)+'</b><span class="v">'+fmtHMS(t)+'<small>'+fmtPace(t/d)+' /km</small></span></div>'});
  h+='</div><h4>'+TT('Ritmos de treino (aprox.)','Training paces (approx.)')+'</h4><div class="rtab">';
  [[TT('Fácil / recuperação','Easy / recovery'),p5+60,p5+90],[TT('Corrida longa','Long run'),p5+55,p5+85],[TT('Limiar (tempo)','Threshold (tempo)'),p10+5,p10+15],[TT('Intervalos','Intervals'),p5-6,p5],[TT('Rectas curtas','Strides'),p5-25,p5-15]].forEach(function(r){
    h+='<div class="rec"><b>'+r[0]+'</b><span class="v">'+fmtPace(r[1])+'–'+fmtPace(r[2])+'<small>'+fmtSpd(3600/r[2])+'–'+fmtSpd(3600/r[1])+' km/h</small></span></div>';
  });
  return h+'</div><p class="note">'+TT('Estimativas pela fórmula de Riegel e regras gerais: servem de guia, não de regra.','Estimates from the Riegel formula and general rules: a guide, not a rule.')+'</p>';
}
function updRef(){var el=$('#refres');if(el)el.innerHTML=refHTML()}
function cvFromSpeed(v){
  var sp=num(v),pm=$('#cvpm'),ps=$('#cvps'),out=$('#cvres');
  if(!(sp>0)){if(out)out.textContent='';return}
  var p=Math.round(3600/sp);pm.value=Math.floor(p/60);ps.value=p%60;
  if(out)out.textContent=fmtSpd(sp)+' km/h = '+fmtPace(p)+' /km';
}
function cvFromPace(){
  var p=num($('#cvpm').value)*60+num($('#cvps').value),sv=$('#cvs'),out=$('#cvres');
  if(!(p>0)){if(out)out.textContent='';return}
  var sp=3600/p;sv.value=(Math.round(sp*10)/10).toFixed(1).replace('.',LANG==='en'?'.':',');
  if(out)out.textContent=fmtPace(p)+' /km = '+fmtSpd(sp)+' km/h';
}

  return '<div class="tblwrap"><table class="ptable"><thead><tr><th>Pace /km</th><th>km/h</th><th>5 km</th><th>10 km</th><th>'+fmtKm(21.1)+' km</th><th>'+fmtKm(42.2)+' km</th></tr></thead><tbody>'+rows+'</tbody></table></div><p class="note">'+TT('De 2:45 a 10:00 por km, de 5 em 5 segundos. Os tempos de prova assumem pace constante.','From 2:45 to 10:00 per km, in 5-second steps. Finish times assume a constant pace.')+(last?' '+TT('A linha a vermelho é o pace da tua última corrida.','The red row is the pace of your last run.'):'')+'</p>';
}
function ritmosHTML(){
  var c=refCalc(),h='';
  h+='<section class="card"><h3 class="ch">'+TT('Conversor velocidade ⇄ pace','Speed ⇄ pace converter')+'</h3><div class="cv"><label class="field"><span>'+TT('Velocidade (km/h)','Speed (km/h)')+'</span><input id="cvs" inputmode="decimal" data-f="cvs" placeholder="16"></label><div class="field"><span>Pace (min/km)</span><div class="tri two"><label><input id="cvpm" inputmode="numeric" data-f="cvpm" placeholder="3"><em>min</em></label><label><input id="cvps" inputmode="numeric" data-f="cvps" placeholder="45"><em>s</em></label></div></div></div><div class="rprev" id="cvres" role="status"></div></section>';

function describe(s){
  var en=LANG==='en';
  switch(s.t){
    case 'easy':return (en?'Easy run of ':'Corrida fácil de ')+fmtKm(s.km)+' km'+(s.strides?(en?' + 6 strides of 20 s':' + 6 rectas de 20 s'):'');

    case 'timetest':return en?'Run '+s.min+' minutes non-stop (plan goal)':'Corre '+s.min+' minutos seguidos (objetivo do plano)';
    case 'long':return (en?'Long run of ':'Corrida longa de ')+fmtKm(s.km)+(en?' km at an easy pace':' km a ritmo fácil');
    case 'tempo':return en?'10 min warm-up + '+s.min+' min at threshold pace + 10 min easy':'10 min de aquecimento + '+s.min+' min a ritmo de limiar + 10 min suaves';
    case 'int':return en?'10 min warm-up + '+s.n+' × '+s.m+' m at interval pace ('+s.r+' s easy jog between) + 10 min easy':'10 min de aquecimento + '+s.n+' × '+s.m+' m a ritmo de intervalos ('+s.r+' s a trote entre repetições) + 10 min suaves';
    case 'fartlek':return en?'Fartlek: 10 min easy + 6 × (1 min fast / 2 min easy) + 10 min easy':'Fartlek: 10 min fáceis + 6 × (1 min rápido / 2 min fácil) + 10 min suaves';
    case 'runwalk':return en?'5 min brisk walk, then '+s.n+' × ('+dur(s.run)+' running + '+dur(s.walk)+' walking)':'5 min a caminhar, depois '+s.n+' × ('+dur(s.run)+' a correr + '+dur(s.walk)+' a caminhar)';
    case 'test':return en?'Test: run '+fmtKm(s.km)+' km as fast as you can (log it!)':'Teste: corre '+fmtKm(s.km)+' km o mais rápido que conseguires (regista a corrida!)';
  }

}
function sessHint(s){
  var r=S.run.ref;if(!r)return '';
  var p5=riegel(r.sec,r.km,5)/5,p10=riegel(r.sec,r.km,10)/10,lab='',a=0,b=0;
  if(s.t==='easy'||s.t==='long'||s.t==='time'||s.t==='fartlek'){lab=TT('Ritmo fácil','Easy pace');a=p5+60;b=p5+90}
  else if(s.t==='tempo'){lab=TT('Ritmo de limiar','Threshold pace');a=p10+5;b=p10+15}
  else if(s.t==='int'){lab=TT('Ritmo de intervalos','Interval pace');a=p5-6;b=p5}
  else if(s.t==='test'){var q=riegel(r.sec,r.km,s.km)/s.km;return TT('Previsão: ','Prediction: ')+fmtPace(q)+' /km ('+fmtHMS(q*s.km)+')'}

}

function runInput(t,f){

    case 'rh':case 'rm':case 'rs':runDraft[f.slice(1)]=t.value;updRunPrev();return true;

    case 'refd':refCalc();refDraft.d=t.value;updRef();return true;
    case 'refh':case 'refm':case 'refs':refCalc();refDraft[f.slice(3)]=t.value;updRef();return true;
  }

function runAction(act,d){
  switch(act){
    case 'rview':runView=d.v;renderApp();return true;
    case 'run-save':
      var km=num(runDraft.km),sec=draftSec();
      if(!(km>0)){toast(TT('Indica a distância.','Enter the distance.'));return true}
      if(!(sec>0)){toast(TT('Indica o tempo.','Enter the time.'));return true}
      var dp=(runDraft.date||todayISODate()).split('-');
      S.runs.push({id:uid(),date:new Date(+dp[0],+dp[1]-1,+dp[2],12,0,0).toISOString(),km:Math.round(km*1000)/1000,sec:Math.round(sec)});
      runDraft={date:todayISODate(),km:'',h:'',m:'',s:''};save();renderApp();toast(TT('Corrida guardada.','Run saved.'));return true;
    case 'run-del':ask(TT('Apagar esta corrida?','Delete this run?'),TT('Apagar','Delete')).then(function(ok){if(ok){S.runs=S.runs.filter(function(r){return r.id!==d.id});save();renderApp()}});return true;
    case 'ref-save':
      var c=refCalc();if(!(c.km>0&&c.sec>0)){toast(TT('Indica o tempo.','Enter the time.'));return true}
      S.run.ref={km:c.km,sec:Math.round(c.sec)};save();toast(TT('Referência guardada.','Reference saved.'));renderApp();return true;
    case 'ref-best':
      var rs=S.runs.filter(function(r){return r.km>=3});
      if(!rs.length){toast(TT('Ainda não tens corridas de 3 km ou mais.','You have no runs of 3 km or more yet.'));return true}
      var bestT=Infinity;rs.forEach(function(r){var e=riegel(r.sec,r.km,5);if(e<bestT)bestT=e});
      refDraft={d:'5',h:String(Math.floor(bestT/3600)||''),m:String(Math.floor(bestT%3600/60)||''),s:String(Math.round(bestT%60)||'')};renderApp();return true;
    case 'rplan-start':
      var go=function(){S.run.plan={id:d.id,start:new Date().toISOString(),done:{}};rWeek=0;runView='plans';save();modal=null;renderModal();renderApp();window.scrollTo(0,0);toast(TT('Plano iniciado.','Plan started.'))};
      if(S.run.plan)ask(TT('Já tens um plano ativo. Substituir por este?','You already have an active plan. Replace it with this one?'),TT('Substituir','Replace')).then(function(ok){if(ok)go()});else go();
      return true;
    case 'rplan-view':modal={type:'rplanview',id:d.id};renderModal();return true;
    case 'rplan-stop':ask(TT('Terminar o plano ativo? O progresso das sessões perde-se.','End the active plan? Session progress will be lost.'),TT('Terminar','End')).then(function(ok){if(ok){S.run.plan=null;rWeek=0;save();renderApp()}});return true;
    case 'rweek-prev':case 'rweek-next':
      var ap=S.run.plan&&planDef(S.run.plan.id);if(!ap)return true;
      var cur=Math.min(ap.weeks,Math.max(1,rWeek||curWeek(ap)));rWeek=Math.min(ap.weeks,Math.max(1,cur+(act==='rweek-next'?1:-1)));renderApp();return true;
    case 'rsess':
      if(!S.run.plan)return true;var dn=S.run.plan.done||(S.run.plan.done={});if(dn[d.k])delete dn[d.k];else dn[d.k]=true;save();renderApp();return true;
  }
  return false;
}

  S.workouts.slice().reverse().forEach(function(w){
    var open=!!openHist[w.id],v=volOf(w);
    h+='<article class="hcard"><button class="hmain" data-act="hist-toggle" data-id="'+esc(w.id)+'" aria-expanded="'+open+'"><span><b>'+esc(w.name)+(w.prs&&w.prs.length?'<span class="pill">'+w.prs.length+' PR</span>':'')+'</b><span class="meta">'+esc(fmtDate(w.date))+' · '+(w.dur||0)+' min'+(v>0?' · '+Math.round(v).toLocaleString(LOC)+' kg':'')+'</span></span><span class="chev">'+(open?'⌃':'⌄')+'</span></button>';
    if(open){
      h+='<div class="hbody">';
      w.exs.forEach(function(e){h+='<p class="hex"><b>'+esc(exName(e.exId,e.name))+'</b><span>'+e.sets.map(fmtSet).join(' · ')+'</span></p>'});
      if(w.prs&&w.prs.length){h+='<ul class="prl">'+w.prs.map(function(p){return '<li><b>'+esc(p.name)+'</b>: '+esc(p.text)+'</li>'}).join('')+'</ul>'}
      h+='<div class="rowbtns"><button class="btn small primary" data-act="hist-repeat" data-id="'+esc(w.id)+'">Repetir treino</button><button class="btn small danger-ghost" data-act="hist-del" data-id="'+esc(w.id)+'">Apagar</button></div></div>';
    }
    h+='</article>';
  });
  return h;
}

/* ---------- render: Progresso ---------- */
function metricVal(e,m){
  var sets=e.sets,v=0;
  if(m==='peso')sets.forEach(function(s){if(s.kg>v)v=s.kg});
  else if(m==='rm')sets.forEach(function(s){if(s.kg>0){var r=est1rm(s.kg,s.reps);if(r>v)v=r}});
  else if(m==='vol')sets.forEach(function(s){v+=s.kg*s.reps});
  else sets.forEach(function(s){if(s.reps>v)v=s.reps});
  return v;
}
function series(exId,m){
  var pts=[];
  S.workouts.forEach(function(w){
    var e=w.exs.filter(function(x){return x.exId===exId})[0];
    if(!e)return;
    var v=metricVal(e,m);
    if(v>0)pts.push({t:new Date(w.date).getTime(),v:v});
  });
  var mx=0;pts.forEach(function(p,i){p.pr=i>0&&p.v>mx;if(p.v>mx)mx=p.v});
  return pts;
}
function chartSVG(pts,unit){
  var W=340,H=170,Lm=40,R=12,T=12,B=26;
  var xs=pts.map(function(p){return p.t}),ys=pts.map(function(p){return p.v});
  var x0=Math.min.apply(0,xs),x1=Math.max.apply(0,xs);if(x0===x1){x0-=864e5*3;x1+=864e5*3}
  var y0=Math.min.apply(0,ys),y1=Math.max.apply(0,ys),pad=(y1-y0)*.25||Math.max(1,y1*.15);
  y0=Math.max(0,Math.floor(y0-pad));y1=Math.ceil(y1+pad);if(y1===y0)y1=y0+1;
  var X=function(t){return Lm+(t-x0)/(x1-x0)*(W-Lm-R)},Y=function(v){return T+(1-(v-y0)/(y1-y0))*(H-T-B)};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de progressão">';
  for(var i=0;i<3;i++){var v=y0+(y1-y0)*i/2,y=Y(v);s+='<line class="gl" x1="'+Lm+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text class="tx2" x="'+(Lm-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+fmtKg(v)+'</text>'}
  var d=pts.map(function(p,i){return (i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.v).toFixed(1)}).join(' ');
  if(pts.length>1)s+='<path class="ln" d="'+d+'"/>';
  pts.forEach(function(p){s+='<circle class="'+(p.pr?'ptpr':'pt')+'" cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="4.5"/>'});
  var dl=function(t){return new Date(t).toLocaleDateString(LOC,{day:'numeric',month:'short'})};
  s+='<text class="tx2" x="'+Lm+'" y="'+(H-8)+'">'+dl(Math.min.apply(0,xs))+'</text><text class="tx2" x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+dl(Math.max.apply(0,xs))+'</text></svg>';
  return s;
}
function usedExIds(){
  var seen={},out=[];
  S.workouts.forEach(function(w){w.exs.forEach(function(e){if(!seen[e.exId]){seen[e.exId]=1;out.push({id:e.exId,name:exName(e.exId,e.name)})}})});
  return out.sort(function(a,b){return a.name.localeCompare(b.name,LANG==='en'?'en':'pt')});
}
function progressoHTML(){
  var h=hdr('Progresso');
  var used=usedExIds();
  if(!used.length)return h+'<p class="empty">O gráfico e os recordes aparecem depois do teu primeiro treino guardado.</p>';
  if(!progEx||!used.some(function(u){return u.id===progEx}))progEx=used[0].id;
  var units={peso:'kg',rm:'kg',vol:'kg',reps:'reps'},labels={peso:'Peso máximo',rm:'1RM estimado',vol:'Volume total',reps:'Repetições (melhor série)'};
  h+='<label class="field"><span>Exercício</span><select data-f="progex">'+used.map(function(u){return '<option value="'+esc(u.id)+'"'+(u.id===progEx?' selected':'')+'>'+esc(u.name)+'</option>'}).join('')+'</select></label>';
  h+='<label class="field"><span>Medida</span><select data-f="progmetric">'+Object.keys(labels).map(function(k){return '<option value="'+k+'"'+(k===progMetric?' selected':'')+'>'+labels[k]+'</option>'}).join('')+'</select></label>';
  var pts=series(progEx,progMetric);
  if(pts.length)h+='<div class="chartbox">'+chartSVG(pts,units[progMetric])+'<p class="note" style="margin:6px 4px 0">Pontos verdes: novo máximo ('+units[progMetric]+').</p></div>';
  else h+='<p class="hint">Sem dados para esta medida neste exercício.</p>';
  h+='<h2>Recordes</h2><div class="card">';
  var any=false;
  used.forEach(function(u){
    var bestKg=0,bestRepsAt=0,bestDate='',bestRm=0,bestReps=0;
    S.workouts.forEach(function(w){w.exs.forEach(function(e){if(e.exId!==u.id)return;e.sets.forEach(function(s){
      if(s.kg>bestKg||(s.kg===bestKg&&s.kg>0&&s.reps>bestRepsAt)){if(s.kg>0){bestKg=s.kg;bestRepsAt=s.reps;bestDate=w.date}}
      if(s.kg>0){var r=est1rm(s.kg,s.reps);if(r>bestRm)bestRm=r}
      if(s.kg===0&&s.reps>bestReps)bestReps=s.reps;
    })})});
    var v='',sm='';
    if(bestKg>0){v=fmtKg(bestKg)+' kg × '+bestRepsAt;sm='1RM est. '+fmtKg(round1(bestRm))+' kg · '+fmtDate(bestDate)}
    else if(bestReps>0){v=bestReps+' reps';sm='Peso corporal'}
    else return;
    any=true;
    h+='<div class="rec"><b>'+esc(u.name)+'</b><span class="v">'+v+'<small>'+sm+'</small></span></div>';
  });
  if(!any)h+='<p class="hint" style="margin:0">Sem recordes ainda.</p>';
  return h+'</div>';
}

/* ---------- descanso ---------- */
var ac=null;
function beep(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.3)}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
}
function startRest(){var ms=S.settings.rest*1000;rest={endAt:Date.now()+ms,total:ms,done:false};renderRest()}
var RC=138.23;
function renderRest(){
  var el=$('#restbar');
  if(!rest){el.innerHTML='';return}
  var frac=rest.done?1:Math.max(0,Math.min(1,(rest.endAt-Date.now())/rest.total));
  el.innerHTML='<div class="rest'+(rest.done?' over':'')+'" role="timer"><div class="rowr"><svg class="ring" viewBox="0 0 54 54" aria-hidden="true"><circle class="trk" cx="27" cy="27" r="22"/><circle class="prg" id="rprg" cx="27" cy="27" r="22" stroke-dasharray="'+RC+'" stroke-dashoffset="'+(RC*(1-frac)).toFixed(1)+'"/></svg><div class="t"><span class="lbl">'+(rest.done?'Descanso terminado':'Descanso')+'</span><span id="rt">'+(rest.done?'Próxima série':fmtDur(rest.endAt-Date.now()+500))+'</span></div>'+(rest.done?'':'<button data-act="rest-add" data-s="-15" aria-label="Menos 15 segundos">−15</button><button data-act="rest-add" data-s="15" aria-label="Mais 15 segundos">+15</button>')+'<button data-act="rest-skip">'+(rest.done?'Fechar':'Saltar')+'</button></div></div>';
}
function tick(){
  if(rest){
    var ms=rest.endAt-Date.now();
    if(!rest.done&&ms<=0){rest.done=true;rest.doneAt=Date.now();beep();renderRest()}
    else if(rest.done&&Date.now()-rest.doneAt>6000){rest=null;renderRest()}
    else if(!rest.done){var rt=$('#rt'),rp=$('#rprg');if(rt)rt.textContent=fmtDur(ms+500);if(rp)rp.setAttribute('stroke-dashoffset',(RC*(1-Math.max(0,Math.min(1,ms/rest.total)))).toFixed(1))}
  }
  var el=$('#elapsed');if(el&&S.active)el.textContent=fmtDur(Date.now()-new Date(S.active.start));
}

/* ---------- acabar treino ---------- */
function bestsBefore(){
  var b={};
  S.workouts.forEach(function(w){w.exs.forEach(function(e){
    var o=b[e.exId]||(b[e.exId]={kg:0,rm:0,reps:0});
    e.sets.forEach(function(s){
      if(s.kg>o.kg)o.kg=s.kg;
      if(s.kg>0){var r=est1rm(s.kg,s.reps);if(r>o.rm)o.rm=r}
      if(s.kg===0&&s.reps>o.reps)o.reps=s.reps;
    });
  })});
  return b;
}
function finish(){
  var a=S.active;
  var exs=a.exs.map(function(e){return {exId:e.exId,name:exName(e.exId,e.name),sets:e.sets.filter(function(s){return s.done&&num(s.reps)>0}).map(function(s){return {kg:num(s.kg),reps:num(s.reps)}})}}).filter(function(e){return e.sets.length});
  if(!exs.length){toast('Marca pelo menos uma série como feita.');return}
  var best=bestsBefore(),prs=[];
  exs.forEach(function(e){
    var b=best[e.exId];if(!b)return;
    var mk=0,mr=0,mreps=0;
    e.sets.forEach(function(s){if(s.kg>mk)mk=s.kg;if(s.kg>0){var r=est1rm(s.kg,s.reps);if(r>mr)mr=r}if(s.kg===0&&s.reps>mreps)mreps=s.reps});
    if(mk>0){
      if(b.kg>0&&mk>b.kg)prs.push({name:e.name,text:'peso máximo de '+fmtKg(mk)+' kg'});
      else if(b.rm>0&&mr>b.rm+.001)prs.push({name:e.name,text:'1RM estimado de '+fmtKg(round1(mr))+' kg'});
    }else if(b.reps>0&&mreps>b.reps)prs.push({name:e.name,text:mreps+' repetições (antes: '+b.reps+')'});
  });
  var w={id:a.id,date:a.start,name:a.name||'Treino',dur:Math.max(1,Math.round((Date.now()-new Date(a.start))/60000)),exs:exs,prs:prs};
  S.workouts.push(w);sortW();S.active=null;rest=null;renderRest();save();
  tab='treino';renderApp();
  modal={type:'summary',w:w};renderModal();
}

function hashPin(pin,salt){
  var str=salt+':'+pin;
  try{
    if(window.crypto&&crypto.subtle&&window.TextEncoder){
      return crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0')}).join('')});
    }
  }catch(e){}
  var h=2166136261;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),16777619)>>>0}
  return Promise.resolve('f'+h.toString(16));
}

  var pin=LK.pin;
  if(LK.mode==='setup'){
    LK.first=pin;LK.mode='confirm';LK.pin='';LK.busy=false;renderLock();return;
  }

    if(pin!==LK.first){LK.first='';LK.mode='setup';wrong('Os PINs não coincidem. Tenta outra vez.');setTimeout(function(){if(LK.show&&LK.mode==='setup')renderLock('Cria um PIN novo.')},620);return}
